version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: quest_mysql_8
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: quest_web
      MYSQL_USER: application
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql

      

volumes:
  mysql_data:
