services:
  backend:
    build: ./backend
    container_name: projet_backend
    ports:
      - "8090:8090"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: application
      DB_PASS: password
      DB_NAME: projet_web
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: admin1234
      MINIO_BUCKET: uploads
      MINIO_PUBLIC_URL: http://localhost:9000/uploads
      RESET_PASSWORD_URL: http://localhost:3000
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$'
      MESSAGERIE_URL: http://messagerie:8081

    volumes:
      - ./backend:/var/www/backend
      - jwt_keys:/var/www/backend/config/jwt
    depends_on:
      - db
    networks:
      - projet_network
    working_dir: /var/www/backend
    dns: # mail dev
      - 8.8.8.8 # mail dev
      - 1.1.1.1 # mail dev
    command: ["symfony", "serve", "--no-tls", "--port=8090"]

  backend-cron:
    build: ./backend
    container_name: projet_backend_cron
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: application
      DB_PASS: password
      DB_NAME: projet_web
    volumes:
      - ./backend:/var/www/backend
      - jwt_keys:/var/www/backend/config/jwt
    depends_on:
      - db
      - backend
    networks:
      - projet_network
    working_dir: /var/www/backend
    entrypoint: ["bash", "-c", "crontab /var/www/backend/crontab && cron -f"]

  frontend:
    build: ./frontend
    container_name: projet_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8090/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:8081
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend
    networks:
      - projet_network

  backoffice:
    build: ./backoffice
    container_name: projet_backoffice
    ports:
      - "2999:3000"
    volumes:
      - ./backoffice:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend
    networks:
      - projet_network

  messagerie:
    build: ./messagerie
    container_name: projet_messagerie
    ports:
      - "8081:8081"
      - "40000-40100:40000-40100/udp"
      - "40000-40100:40000-40100/tcp"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: application
      DB_PASS: password
      DB_NAME: projet_web
      PORT: 8081
      CORS_ORIGIN: "http://localhost:3000"
      MEDIASOUP_ANNOUNCED_IP: "192.168.1.109" # ATTENTION : mettre l'ip du serveur ici, ou de votre machine en mode dev cmd : ifconfig | grep "inet "
    volumes:
      - ./messagerie:/app
      - /app/node_modules
      - jwt_keys:/app/src/config/jwt
    command: npm run dev
    depends_on:
      - db
    networks:
      - projet_network

  db:
    image: mysql:8.0
    container_name: projet_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projet_web
      MYSQL_USER: application
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - projet_network

  minio:
    image: minio/minio:latest
    container_name: projet_minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console d'administration
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin1234
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - projet_network

  minio-mc:
    image: minio/mc
    container_name: projet_minio_mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 admin admin1234;
      mc mb local/uploads || true;
      mc anonymous set download local/uploads;
      exit 0
      "
    networks:
      - projet_network

volumes:
  db_data:
  minio_data:
  jwt_keys:

networks:
  projet_network:
    driver: bridge
