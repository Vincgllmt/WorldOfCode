services:
  backend:
    build: ./backend
    container_name: projet_backend
    ports:
      - "8090:8090"
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - db
    networks:
      - projet_network
    working_dir: /var/www/backend
    dns: # mail dev
      - 8.8.8.8 # mail dev
      - 1.1.1.1 # mail dev

  frontend:
    build: ./frontend
    container_name: projet_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend
    networks:
      - projet_network

  backoffice:
    build: ./backoffice
    container_name: projet_backoffice
    ports:
      - "2999:3000"
    volumes:
      - ./backoffice:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend
    networks:
      - projet_network

  messagerie:
    build: ./messagerie
    container_name: projet_messagerie
    ports:
      - "8081:8081"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: application
      DB_PASS: password
      DB_NAME: projet_web
      PORT: 8081
      CORS_ORIGIN: "http://localhost:3000"
    volumes:
      - ./messagerie:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - db
    networks:
      - projet_network

  db:
    image: mysql:8.0
    container_name: projet_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projet_web
      MYSQL_USER: application
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - projet_network

volumes:
  db_data:

networks:
  projet_network:
    driver: bridge
