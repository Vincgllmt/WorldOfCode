services:
  backend:
    build: ./backend
    container_name: projet_backend
    ports:
      - "8090:8090"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: application
      DB_PASS: password
      DB_NAME: projet_web
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: admin1234
      MINIO_BUCKET: uploads
      MINIO_PUBLIC_URL: http://localhost:9000/uploads
      RESET_PASSWORD_URL: http://localhost:3000
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$'
      MESSAGERIE_URL: http://messagerie:8081
      MAILER_DSN: smtp://noreply.worldofcode@gmail.com:ayrwjiknectnokcf@smtp.gmail.com:587
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: projet_es_dev_password

    volumes:
      - ./backend:/var/www/backend
      - jwt_keys:/var/www/backend/config/jwt
    depends_on:
      db:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    networks:
      - projet_network
    working_dir: /var/www/backend
    dns: # mail dev
      - 8.8.8.8 # mail dev
      - 1.1.1.1 # mail dev
    command: ["symfony", "serve", "--no-tls", "--port=8090"]

  backend-cron:
    build: ./backend
    container_name: projet_backend_cron
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: application
      DB_PASS: password
      DB_NAME: projet_web
    volumes:
      - ./backend:/var/www/backend
      - jwt_keys:/var/www/backend/config/jwt
    depends_on:
      - db
      - backend
    networks:
      - projet_network
    working_dir: /var/www/backend
    entrypoint: ["bash", "-c", "crontab /var/www/backend/crontab && cron -f"]

  frontend:
    build: ./frontend
    container_name: projet_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8090/api
      NEXT_PUBLIC_ARENA_API_URL: http://localhost:8082
      NEXT_PUBLIC_SOCKET_URL: http://localhost:8081
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend
    networks:
      - projet_network

  backoffice:
    build: ./backoffice
    container_name: projet_backoffice
    ports:
      - "2999:3000"
    volumes:
      - ./backoffice:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend
    networks:
      - projet_network

  messagerie:
    build: ./messagerie
    container_name: projet_messagerie
    ports:
      - "8081:8081"
      - "40000-40100:40000-40100/udp"
      - "40000-40100:40000-40100/tcp"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: application
      DB_PASS: password
      DB_NAME: projet_web
      PORT: 8081
      CORS_ORIGIN: "http://localhost:3000"
      MEDIASOUP_ANNOUNCED_IP: "192.168.1.109" # ATTENTION : mettre l'ip du serveur ici, ou de votre machine en mode dev cmd : ifconfig | grep "inet "
    volumes:
      - ./messagerie:/app
      - /app/node_modules
      - jwt_keys:/app/src/config/jwt
    command: >
      sh -c "until [ -f /app/src/config/jwt/public.pem ]; do echo 'Waiting for JWT public key...'; sleep 2; done && npm run dev"
    depends_on:
      - db
      - backend
    networks:
      - projet_network

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: projet_piston
    privileged: true
    ports:
      - "2000:2000"
    tmpfs:
      - /piston/jobs
    volumes:
      - piston_packages:/piston/packages
    networks:
      - projet_network
    # Installer les runtimes au premier démarrage (une seule fois, persistés dans le volume) :
    #   docker exec projet_piston piston ppman install php
    #   docker exec projet_piston piston ppman install node

  piston-install:
    image: ghcr.io/engineer-man/piston
    container_name: projet_piston_install
    environment:
      PISTON_URL: http://piston:2000
    entrypoint: >
      sh -c "
        echo 'Attente du démarrage de Piston...' &&
        sleep 8 &&
        piston ppman install php &&
        piston ppman install node &&
        echo 'Runtimes installés.'
      "
    depends_on:
      - piston
    networks:
      - projet_network
    restart: "no"

  code-arena:
    build: ./code-arena
    container_name: projet_code_arena
    ports:
      - "8082:8082"
    environment:
      # Base partagée projet_web (schéma possédé par le backend, jamais migré ici)
      DATABASE_URL: "mysql://application:password@db:3306/projet_web?serverVersion=8.0&charset=utf8mb4"
      APP_ENV: dev
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$'
      PISTON_URL: http://piston:2000
    volumes:
      - ./code-arena:/app
      - /app/vendor
      - jwt_keys:/app/config/jwt
    depends_on:
      - db
      - backend
      - piston
    networks:
      - projet_network
    working_dir: /app
    command: ["symfony", "serve", "--no-tls", "--port=8082", "--allow-all-ip"]

  db:
    image: mysql:8.0
    container_name: projet_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projet_web
      MYSQL_USER: application
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - projet_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: projet_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=projet_es_dev_password
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:projet_es_dev_password http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - projet_network

  minio:
    image: minio/minio:latest
    container_name: projet_minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console d'administration
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin1234
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - projet_network

  minio-mc:
    image: minio/mc
    container_name: projet_minio_mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 admin admin1234;
      mc mb local/uploads || true;
      mc anonymous set download local/uploads;
      exit 0
      "
    networks:
      - projet_network

volumes:
  db_data:
  minio_data:
  jwt_keys:
  elasticsearch_data:
  piston_packages:

networks:
  projet_network:
    driver: bridge
