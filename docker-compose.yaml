version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "9000:9000"
    volumes:
      - .:/var/www/backend
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: quest_mysql_8
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: quest_web
      MYSQL_USER: application
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql


  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

volumes:
  db-mysql_data:
