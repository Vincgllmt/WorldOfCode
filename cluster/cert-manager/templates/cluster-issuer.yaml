    server: https://acme-v02.api.letsencrypt.org/directory
    email: hichem.eld@gmail.com 
    # Nom du secret où la clé privée du compte ACME sera stockée
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
    - http01:
        ingress:
          class: traefik