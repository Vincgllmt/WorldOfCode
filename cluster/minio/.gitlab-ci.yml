deploy:minio:dev:
  stage: deploy-services
  environment:
    name: dev
  variables:
    APP_NAMESPACE: "dev"
    RELEASE_NAME: "minio"
    MINIO_CHART: "bitnami/minio"
    MINIO_CHART_VERSION: "17.0.21"
    VALUES_FILE: "cluster/minio/values-dev.yaml"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true
  script:
    - kubectl create namespace "$APP_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
    - helm repo add bitnami https://charts.bitnami.com/bitnami
    - helm repo update
    - echo "Déploiement de MinIO sur la DEV"
    - |
      helm upgrade --install "$RELEASE_NAME" "$MINIO_CHART" \
        --namespace "$APP_NAMESPACE" \
        --version "$MINIO_CHART_VERSION" \
        --values "$VALUES_FILE"

deploy:minio:prod:
  stage: deploy-services
  environment:
    name: production
  variables:
    APP_NAMESPACE: "production"
    RELEASE_NAME: "minio"
    MINIO_CHART: "bitnami/minio"
    MINIO_CHART_VERSION: "17.0.21"
    VALUES_FILE: "cluster/minio/values-prod.yaml"
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
      when: manual
  script:
    - kubectl create namespace "$APP_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
    - helm repo add bitnami https://charts.bitnami.com/bitnami
    - helm repo update
    - echo "Déploiement de MinIO sur la PRODUCTION"
    - |
      helm upgrade --install "$RELEASE_NAME" "$MINIO_CHART" \
        --namespace "$APP_NAMESPACE" \
        --version "$MINIO_CHART_VERSION" \
        --values "$VALUES_FILE"