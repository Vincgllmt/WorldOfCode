global:
  security:
    allowInsecureImages: true

image:
  repository: bitnamilegacy/minio
clientImage:
  repository: bitnamilegacy/minio-client

mode: standalone

auth:
  rootUser: admin
  rootPassword: admin1234

persistence:
  enabled: true
  storageClass: longhorn-preprod
  size: 2Gi

ingress:
  enabled: true
  ingressClassName: "traefik"
  hostname: minio-api-preprod.woc
  path: /
  pathType: Prefix
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  tls: false


console:  
  image:
    repository: bitnamilegacy/minio-object-browser
  enabled: true
  ingress:
    enabled: true
    ingressClassName: "traefik"
    hostname: minio.preprod
    path: /
    pathType: Prefix
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    tls: false


resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "250m"