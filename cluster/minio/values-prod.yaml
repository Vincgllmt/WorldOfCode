global:
  security:
    allowInsecureImages: true

image:
  repository: bitnamilegacy/minio
clientImage:
  repository: bitnamilegacy/minio-client

mode: standalone
automountServiceAccountToken: true

auth:
  rootUser: admin

serviceAccount:
  automountServiceAccountToken: true

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: "app"
  vault.hashicorp.com/agent-init-first: "false"
  vault.hashicorp.com/agent-inject-secret-minio-root: "secret/data/production/minio"
  vault.hashicorp.com/agent-inject-template-minio-root: |
    {{ "{{- with secret \"secret/data/production/minio\" -}}" }}
    {{ "{{ .Data.data.rootPassword }}" }}
    {{ "{{- end -}}" }}
initContainers:
  - name: wait-for-vault
    image: curlimages/curl:8.13.0
    command: ["/bin/sh", "-c"]
    args:
      - |
        echo "Attente de Vault unsealed..."
        until curl -s http://vault.vault.svc:8200/v1/sys/health | grep -q '"sealed":false'; do
          echo "Vault est scellé, nouvelle tentative dans 5s..."
          sleep 5
        done
        echo "Vault prêt."

extraEnvVars:
  - name: MINIO_ROOT_PASSWORD_FILE
    value: "/vault/secrets/minio-root"

defaultBuckets: "uploads"

persistence:
  enabled: true
  storageClass: longhorn
  size: 10Gi

ingress:
  enabled: true
  ingressClassName: "traefik"
  hostname: minio-api.woc
  path: /
  pathType: Prefix
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  tls: false


console:  
  automountServiceAccountToken: true
  image:
    repository: bitnamilegacy/minio-object-browser
  enabled: true
  ingress:
    enabled: true
    ingressClassName: "traefik"
    hostname: minio.woc.production
    path: /
    pathType: Prefix
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    tls: false


