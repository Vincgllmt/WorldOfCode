global:
  security:
    allowInsecureImages: true

image:
  repository: bitnamilegacy/minio
clientImage:
  repository: bitnamilegacy/minio-client

mode: standalone

auth:
  rootUser: admin

serviceAccount:
  automountServiceAccountToken: true

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: "app"
  vault.hashicorp.com/agent-inject-secret-minio-root: "secret/data/minio"
  vault.hashicorp.com/agent-inject-template-minio-root: |
    {{ "{{- with secret \"secret/data/minio\" -}}" }}
    {{ "{{ .Data.data.rootPassword }}" }}
    {{ "{{- end -}}" }}
extraEnvVars:
  - name: MINIO_ROOT_PASSWORD_FILE
    value: "/vault/secrets/minio-root"

persistence:
  enabled: true
  storageClass: local-path
  size: 2Gi

ingress:
  enabled: true
  ingressClassName: "traefik"
  hostname: minio-api-dev.woc
  path: /
  pathType: Prefix
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  tls: false

console:
  image:
    repository: bitnamilegacy/minio-object-browser
  enabled: true
  ingress:
    enabled: true
    ingressClassName: "traefik"
    hostname: minio.dev.woc
    path: /
    pathType: Prefix
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    tls: false

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "250m"
