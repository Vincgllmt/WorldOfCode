# 1. Build avec Kaniko (sans Docker-in-Docker)
build:frontend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  before_script: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "preprod" || $CI_COMMIT_BRANCH == "production"'
      changes:
        - frontend/**/*
        - cluster/frontend/**/*
  script:
    - echo "Configuration de l'authentification Kaniko..."
    # Utilisation de | pour éviter les erreurs de guillemets YAML
    - |
      echo "{\"auths\":{\"${REGISTRY_HOST}\":{\"auth\":\"$(printf "%s:%s" "${REGISTRY_USER}" "${REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/frontend" \
        --dockerfile "${CI_PROJECT_DIR}/frontend/Dockerfile" \
        --destination "${REGISTRY_HOST}/frontend:${CI_COMMIT_SHORT_SHA}" \
        --build-arg NEXT_PUBLIC_API_URL="https://api.${APP_NAMESPACE}.woc/api" \
        --build-arg NEXT_PUBLIC_SOCKET_URL="https://api.${APP_NAMESPACE}.woc" \
        --build-arg NEXT_PUBLIC_WOC_URL="https://woc.${APP_NAMESPACE}" \
        --insecure \
        --skip-tls-verify \
        --cache=true

# 2. Déploiement en PRÉPROD
deploy:frontend:preprod:
  stage: deploy-apps
  extends: .deploy_helm_template
  environment:
    name: preprod
  variables:
    APP_NAMESPACE: "preprod"
    RELEASE_NAME: "frontend"
    CHART_PATH: "cluster/frontend"
    IMAGE_PULL_SECRET: "woc-regcred"
    VALUES_FILE: "cluster/frontend/values-preprod.yaml"
  rules:
    - if: '$CI_COMMIT_BRANCH == "preprod"'
      changes:
        - frontend/**/* 
        - cluster/frontend/**/*
      when: on_success

    - if: '$CI_COMMIT_BRANCH == "preprod"'
      when: manual
      allow_failure: true

# 3. Déploiement en PRODUCTION
deploy:frontend:prod:
  stage: deploy-apps
  extends: .deploy_helm_template
  environment:
    name: production
  variables:
    APP_NAMESPACE: "production"
    RELEASE_NAME: "frontend"
    CHART_PATH: "cluster/frontend"
    IMAGE_PULL_SECRET: "woc-regcred"
    VALUES_FILE: "cluster/frontend/values-prod.yaml"
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
      changes:
        - frontend/**/*
        - cluster/frontend/**/*
      when: manual