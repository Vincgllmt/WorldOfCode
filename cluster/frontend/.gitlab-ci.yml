build:frontend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  before_script: []
  rules:
    - if: '$CI_COMMIT_TAG =~ /^frontend-v.*$/'
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - frontend/**/*
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true
  script:
    - export IMAGE_TAG=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export API_DOMAIN="api-worldofcode.duckdns.org"
        export WOC_DOMAIN="worldofcode.duckdns.org"
      else
        export API_DOMAIN="api-woc-dev.duckdns.org"
        export WOC_DOMAIN="woc-dev.duckdns.org"
      fi
    - echo "{\"auths\":{\"${REGISTRY_HOST}\":{\"auth\":\"$(printf "%s:%s" "${REGISTRY_USER}" "${REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/frontend" \
        --dockerfile "${CI_PROJECT_DIR}/frontend/Dockerfile.prod" \
        --destination "${REGISTRY_HOST}/frontend:${IMAGE_TAG}" \
        --build-arg NEXT_PUBLIC_API_URL="https://${API_DOMAIN}/api" \
        --build-arg NEXT_PUBLIC_SOCKET_URL="https://${API_DOMAIN}" \
        --build-arg NEXT_PUBLIC_WOC_URL="https://${WOC_DOMAIN}" \
        --build-arg NEXT_PUBLIC_STORAGE_URL="https://${API_DOMAIN}/storage" \
        --build-arg NEXT_PUBLIC_ARENA_API_URL="https://${API_DOMAIN}" \
        --build-arg NEXT_PUBLIC_ARENA_URL="https://${API_DOMAIN}" \
        --insecure \
        --skip-tls-verify \
        --cache=true \
        --snapshotMode=redo \
        --compressed-caching=false


