# 1. Build avec Kaniko (sans Docker-in-Docker)
build:frontend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  before_script: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
      changes:
        - frontend/**/*
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true
  variables:
    API_DOMAIN: "api-woc-dev.duckdns.org"
    WOC_DOMAIN: "woc-dev.duckdns.org"
  script:
    - echo "Configuration de l'authentification Kaniko..."
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        export API_DOMAIN="api-woc-prod.duckdns.org"
        export WOC_DOMAIN="woc-prod.duckdns.org"
      fi
    - |
      echo "{\"auths\":{\"${REGISTRY_HOST}\":{\"auth\":\"$(printf "%s:%s" "${REGISTRY_USER}" "${REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/frontend" \
        --dockerfile "${CI_PROJECT_DIR}/frontend/Dockerfile.prod" \
        --destination "${REGISTRY_HOST}/frontend:${CI_COMMIT_SHORT_SHA}" \
        --build-arg NEXT_PUBLIC_API_URL="https://${API_DOMAIN}/api" \
        --build-arg NEXT_PUBLIC_SOCKET_URL="https://${API_DOMAIN}" \
        --build-arg NEXT_PUBLIC_WOC_URL="https://${WOC_DOMAIN}" \
        --build-arg NEXT_PUBLIC_STORAGE_URL="https://${API_DOMAIN}/storage" \
        --insecure \
        --skip-tls-verify \
        --cache=true


