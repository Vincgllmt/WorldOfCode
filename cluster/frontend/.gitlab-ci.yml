deploy:frontend:dev:
  stage: deploy-apps
  needs:
    - job: "build:frontend"
      optional: true
  extends: .deploy_helm_template
  environment:
    name: dev
  variables:
    APP_NAMESPACE: "dev"
    RELEASE_NAME: "frontend"
    CHART_PATH: "cluster/frontend"
    IMAGE_PULL_SECRET: "woc-regcred"
    VALUES_FILE: "cluster/frontend/values-dev.yaml"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - frontend/**/*
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true

deploy:frontend:prod:
  stage: deploy-apps
  needs:
    - job: "build:frontend"
      optional: true
  extends: .deploy_helm_template
  environment:
    name: production
  variables:
    APP_NAMESPACE: "production"
    RELEASE_NAME: "frontend"
    CHART_PATH: "cluster/frontend"
    IMAGE_PULL_SECRET: "woc-regcred"
    VALUES_FILE: "cluster/frontend/values-prod.yaml"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^frontend-v.*$/'