apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "woc-frontend.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "woc-frontend.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "woc-frontend.name" . }}
    spec:
      imagePullSecrets:
      - name: {{ .Values.registry.imagePullSecretName }}
      containers:
      - name: frontend 
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: {{ .Values.containerPort }}
        {{- if .Values.env }}
        env:
        {{- range $key, $value := .Values.env }}
          - name: {{ $key }}
            value: {{ $value | quote }}
        {{- end }}
        {{- end }}