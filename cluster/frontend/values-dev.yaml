replicaCount: 1

image:
  repository: registry.woc:32000/frontend
  pullPolicy: IfNotPresent

registry:
  imagePullSecretName: woc-regcred

service:
  type: ClusterIP
  port: 3000

containerPort: 3000

env:
  # CORRECTION : Pointe vers l'Ingress du Backend
  NEXT_PUBLIC_API_URL: "http://api.dev.woc/api"
  
  # Pointe vers l'Ingress du Frontend (soi-même)
  NEXT_PUBLIC_WOC_URL: "http://woc.dev"
  
  # CORRECTION : Le socket passe par le Nginx du Backend
  NEXT_PUBLIC_SOCKET_URL: "http://api.dev.woc"
  NEXT_PUBLIC_SOCKET_PATH: "/api/messaging/socket.io"

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: woc.dev
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"