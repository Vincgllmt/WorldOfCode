replicaCount: 1

image:
  repository: registry.woc:32000/frontend
  pullPolicy: IfNotPresent

registry:
  imagePullSecretName: woc-regcred

service:
  type: ClusterIP
  port: 3000

containerPort: 3000

env:
  NEXT_PUBLIC_API_URL: "https://api-woc-dev.duckdns.org/api"
  NEXT_PUBLIC_WOC_URL: "https://woc-dev.duckdns.org"
  NEXT_PUBLIC_SOCKET_URL: "https://api-woc-dev.duckdns.org"

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: woc-dev.duckdns.org
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"