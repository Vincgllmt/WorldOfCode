# Installe les CRDs (Custom Resource Definitions) nécessaires
vmServiceScrape:
  enabled: true

# 1. Configuration de l'instance VictoriaMetrics Single
vmsingle:
  enabled: true
  spec:
    retentionPeriod: "7d"
    replicaCount: 1       # On reste simple
    
    storage:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 8Gi
      storageClassName: local-path

# 2. Désactivation des composants Cluster (inutiles pour toi)
vmcluster:
  enabled: false

# alertmanager:
#   enabled: false

# vmalert:
#   enabled: false

prometheus-node-exporter:
  enabled: true
  
  # 1. On met à jour le Service Kubernetes
  service:
    port: 9110
    targetPort: 9110
  
  # 2. On configure le conteneur
  containerPort: 9110
  hostPort: 9110

  # 3. On met à jour les sondes de vie (TRES IMPORTANT)
  livenessProbe:
    httpGet:
      port: 9110
      path: /
  
  readinessProbe:
    httpGet:
      port: 9110
      path: /

grafana:
  enabled: true

  persistence:
    enabled: true
    storageClassName: "local-path"
    size: 5Gi

  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki-datasource
      url: http://loki.monitoring.svc:3100
      access: proxy
      isDefault: false
      jsonData: {}

  defaultDashboardsEnabled: true

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: woc
          orgId: 1
          folder: WOC
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/woc

