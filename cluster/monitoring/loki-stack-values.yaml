loki:
  enabled: true
  isDefault: false
  
  commonConfig:
    replication_factor: 1
    path_prefix: /data/loki

  schemaConfig:
    configs:
      - from: 2024-04-01
        store: boltdb-shipper
        object_store: filesystem
        schema: v11
        index:
          prefix: index_
          period: 24h

  # Configuration du stockage physique
  storage:
    type: filesystem
  
  # -----------------------------------------------------------
  # CRITIQUE : NETTOYAGE AUTOMATIQUE DES LOGS
  # -----------------------------------------------------------
  compactor:
    working_directory: /data/loki/boltdb-shipper-compactor
    shared_store: filesystem
    compaction_interval: 10m
    retention_enabled: true             # <--- Active la suppression
    retention_delete_delay: 2h
    retention_delete_worker_count: 150

  limits_config:
    retention_period: 168h              # <--- Garde 7 jours

  # -----------------------------------------------------------
  # DIMENSIONNEMENT DU DISQUE
  # -----------------------------------------------------------
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: local-path

promtail:
  enabled: true
