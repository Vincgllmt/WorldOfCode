apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-alerting-setup
  namespace: monitoring
  annotations:
    job-version: "7"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: alpine/curl:latest
          env:
            - name: GRAFANA_URL
              value: "http://vm-stack-grafana.monitoring.svc:80"
            - name: GRAFANA_USER
              value: "admin"
            - name: GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vm-stack-grafana
                  key: admin-password
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              AUTH="${GRAFANA_USER}:${GRAFANA_PASSWORD}"
              BASE="${GRAFANA_URL}"

              # upsert <uid> <json-payload> : PUT (update) puis POST (create) en secours
              upsert_rule() {
                uid="$1"; payload="$2"
                curl -sf -u "$AUTH" -X PUT "$BASE/api/v1/provisioning/alert-rules/$uid" \
                  -H "Content-Type: application/json" -d "$payload" >/dev/null 2>&1 || \
                curl -sf -u "$AUTH" -X POST "$BASE/api/v1/provisioning/alert-rules" \
                  -H "Content-Type: application/json" -d "$payload" >/dev/null 2>&1 || \
                { echo "ERREUR: upsert règle $uid"; return 1; }
                echo "règle $uid OK"
              }

              echo "=== 1. Dossier WOC Alerting ==="
              curl -sf -u "$AUTH" -X POST "$BASE/api/folders" \
                -H "Content-Type: application/json" \
                -d '{"uid":"woc-alerting","title":"WOC Alerting"}' 2>&1 || true

              echo ""
              echo "=== 2. Template de notification ==="
              curl -f -u "$AUTH" -X PUT "$BASE/api/v1/provisioning/templates/woc-alert-template" \
                -H "Content-Type: application/json" \
                -d '{
                  "name": "woc-alert-template",
                  "template": "{{ define \"woc-alert-template\" -}}\n{{ if eq .Status \"firing\" }}<b>🔴 FIRING — WOC Backend</b>{{ else }}<b>✅ RESOLU — WOC Backend</b>{{ end }}\n{{ range .Alerts }}\n<b>{{ .Annotations.summary }}</b>\n\n<b>📊 Contexte</b>\nNamespace : <b>{{ index .Labels \"namespace\" }}</b>\nRoute     : <b>{{ index .Labels \"context_route\" }}</b>\nSeverite  : <b>{{ index .Labels \"severity\" }}</b>\nCode HTTP : <b>{{ index .Labels \"context_status_code\" }}</b>\n\n<b>📝 Detail</b>\n{{ .Annotations.description }}\n\nDeclenche le {{ .StartsAt.Format \"02/01/2006 15:04:05\" }}\n{{ end -}}\n{{- end }}"
                }'
              echo ""

              echo "=== 3. Contact Point Google Chat ==="
              curl -sf -u "$AUTH" -X PUT "$BASE/api/v1/provisioning/contact-points/google-chat-woc" \
                -H "Content-Type: application/json" \
                -d '{
                  "uid": "google-chat-woc",
                  "name": "Google Chat WOC",
                  "type": "googlechat",
                  "settings": {
                    "url": "https://chat.googleapis.com/v1/spaces/AAQAsdDI51U/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=FCVHkdyJ8-jM6ixoIGdiSJDaYJBgtan_Mo_wZ8e3TS4",
                    "message": "{{ template \"woc-alert-template\" . }}"
                  },
                  "disableResolveMessage": false
                }' 2>/dev/null || \
              curl -sf -u "$AUTH" -X POST "$BASE/api/v1/provisioning/contact-points" \
                -H "Content-Type: application/json" \
                -d '{
                  "uid": "google-chat-woc",
                  "name": "Google Chat WOC",
                  "type": "googlechat",
                  "settings": {
                    "url": "https://chat.googleapis.com/v1/spaces/AAQAsdDI51U/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=FCVHkdyJ8-jM6ixoIGdiSJDaYJBgtan_Mo_wZ8e3TS4",
                    "message": "{{ template \"woc-alert-template\" . }}"
                  },
                  "disableResolveMessage": false
                }' 2>/dev/null || echo "Contact point géré par le sidecar, skip"
              echo ""

              echo "=== 4. Politique de notification ==="
              curl -f -u "$AUTH" -X PUT "$BASE/api/v1/provisioning/policies" \
                -H "Content-Type: application/json" \
                -d '{
                  "receiver": "Google Chat WOC",
                  "group_by": ["alertname", "namespace"],
                  "routes": []
                }'
              echo ""

              # ────────────────────────────────────────────────────────────────
              # Chaîne d'évaluation (IMPORTANT) :
              #   A = requête Loki (range, count_over_time[1m]) → série temporelle
              #   B = reduce "last"  → réduit A à UNE valeur par série
              #   C = threshold > 0  → condition de déclenchement
              # Sans le nœud reduce B, le scheduler reçoit une série au lieu d'un
              # scalaire et tombe en état "Error" → l'alerte ne fire JAMAIS.
              # condition = C. execErrState = Error pour rendre toute panne visible.
              # ────────────────────────────────────────────────────────────────

              echo "=== 5. Règle : Erreurs utilisateurs (4xx) ==="
              upsert_rule woc-user-errors-loki '{
                "uid": "woc-user-errors-loki",
                "title": "Erreurs utilisateurs WOC (4xx)",
                "ruleGroup": "woc-errors",
                "folderUID": "woc-alerting",
                "condition": "C",
                "noDataState": "OK",
                "execErrState": "Error",
                "for": "0s",
                "data": [
                  {"refId":"A","queryType":"range","relativeTimeRange":{"from":60,"to":0},"datasourceUid":"loki-datasource","model":{"datasource":{"type":"loki","uid":"loki-datasource"},"editorMode":"code","expr":"sum by (namespace, context_status_code, context_route)(count_over_time({app=\"backend\", container=\"php-fpm\"} | json | channel=\"user_error\" [1m]))","instant":false,"range":true,"refId":"A"}},
                  {"refId":"B","datasourceUid":"__expr__","model":{"type":"reduce","reducer":"last","expression":"A","datasource":{"type":"__expr__","uid":"__expr__"},"refId":"B"}},
                  {"refId":"C","datasourceUid":"__expr__","model":{"type":"threshold","expression":"B","conditions":[{"evaluator":{"params":[0],"type":"gt"}}],"datasource":{"type":"__expr__","uid":"__expr__"},"refId":"C"}}
                ],
                "annotations": {
                  "summary": "Erreur utilisateur detectee sur WOC",
                  "description": "Namespace : {{ index $labels \"namespace\" }} | Route : {{ index $labels \"context_route\" }} | HTTP {{ index $labels \"context_status_code\" }} reçu sur le backend. Détail (IP, user, message) dans Loki : {app=\"backend\"} | json | channel=`user_error`"
                },
                "labels": {"severity": "warning", "team": "woc"},
                "isPaused": false,
                "notification_settings": {"receiver": "Google Chat WOC"}
              }'
              echo ""

              echo "=== 6. Règle : Erreurs serveur (5xx) ==="
              upsert_rule woc-server-errors-loki '{
                "uid": "woc-server-errors-loki",
                "title": "Erreurs serveur WOC (5xx)",
                "ruleGroup": "woc-errors",
                "folderUID": "woc-alerting",
                "condition": "C",
                "noDataState": "OK",
                "execErrState": "Error",
                "for": "0s",
                "data": [
                  {"refId":"A","queryType":"range","relativeTimeRange":{"from":60,"to":0},"datasourceUid":"loki-datasource","model":{"datasource":{"type":"loki","uid":"loki-datasource"},"editorMode":"code","expr":"sum by (namespace, context_status_code, context_route, context_exception_class)(count_over_time({app=\"backend\", container=\"php-fpm\"} | json | channel=\"server_error\" [1m]))","instant":false,"range":true,"refId":"A"}},
                  {"refId":"B","datasourceUid":"__expr__","model":{"type":"reduce","reducer":"last","expression":"A","datasource":{"type":"__expr__","uid":"__expr__"},"refId":"B"}},
                  {"refId":"C","datasourceUid":"__expr__","model":{"type":"threshold","expression":"B","conditions":[{"evaluator":{"params":[0],"type":"gt"}}],"datasource":{"type":"__expr__","uid":"__expr__"},"refId":"C"}}
                ],
                "annotations": {
                  "summary": "🚨 Erreur serveur critique sur WOC",
                  "description": "Namespace : {{ index $labels \"namespace\" }} | Route : {{ index $labels \"context_route\" }} | Exception : {{ index $labels \"context_exception_class\" }} → HTTP {{ index $labels \"context_status_code\" }}. Détail complet (message, file, line) dans Loki : {app=\"backend\"} | json | channel=`server_error`"
                },
                "labels": {"severity": "critical", "team": "woc"},
                "isPaused": false,
                "notification_settings": {"receiver": "Google Chat WOC"}
              }'
              echo ""
              echo "=== Configuration alerting Grafana terminee ==="
