apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-provisioning
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  # ──────────────────────────────────────────────────────────────────────────
  # Template de notification (HTML — Google Chat textParagraph ne supporte
  # pas le markdown *bold*, uniquement les balises HTML <b>, <i>, <br>)
  # ──────────────────────────────────────────────────────────────────────────
  templates.yaml: |
    apiVersion: 1
    templates:
      - orgId: 1
        name: woc-alert-template
        template: |
          {{ define "woc-alert-template" -}}
          {{ if eq .Status "firing" }}<b>🔴 FIRING — WOC Backend</b>{{ else }}<b>✅ RESOLU — WOC Backend</b>{{ end }}
          {{ range .Alerts }}
          <b>{{ .Annotations.summary }}</b>

          <b>📊 Contexte</b>
          Namespace : <b>{{ index .Labels "namespace" }}</b>
          Route     : <b>{{ index .Labels "context_route" }}</b>
          Severite  : <b>{{ index .Labels "severity" }}</b>
          Code HTTP : <b>{{ index .Labels "context_status_code" }}</b>

          <b>📝 Detail</b>
          {{ .Annotations.description }}

          Declenche le {{ .StartsAt.Format "02/01/2006 15:04:05" }}
          {{ end -}}
          {{- end }}

  # ──────────────────────────────────────────────────────────────────────────
  # Contact Point : Google Chat WOC
  # ──────────────────────────────────────────────────────────────────────────
  contactpoints.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: Google Chat WOC
        receivers:
          - uid: google-chat-woc
            type: googlechat
            settings:
              # Injecté via env sur le pod Grafana (Secret grafana-googlechat-webhook)
              url: "$__env{GOOGLE_CHAT_WEBHOOK_URL}"
              message: '{{ template "woc-alert-template" . }}'
            disableResolveMessage: false

  # ──────────────────────────────────────────────────────────────────────────
  # Politique de notification
  # ──────────────────────────────────────────────────────────────────────────
  notificationpolicies.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: Google Chat WOC
        group_by: ["alertname", "namespace"]
        routes: []

  # ──────────────────────────────────────────────────────────────────────────
  # Règles d'alerte
  #
  # ⚠️ INACTIF PAR DÉFAUT : ce ConfigMap n'est provisionné que si le sidecar
  # d'alerting de Grafana est activé (grafana.sidecar.alerts.enabled: true dans
  # vm-stack-values.yaml). Tant qu'il ne l'est pas, la source de vérité réelle
  # est le Job grafana-alerting-job.yaml (provisioning via API). Garder les deux
  # en cohérence.
  #
  # Chaîne d'évaluation : A (requête Loki range) → B (reduce "last") → C
  # (threshold > 0). Le nœud reduce B est OBLIGATOIRE : sans lui, la condition
  # reçoit une série temporelle au lieu d'un scalaire et l'évaluation tombe en
  # "Error" → l'alerte ne fire jamais.
  # ──────────────────────────────────────────────────────────────────────────
  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: woc-errors
        folder: WOC Alerting
        interval: 1m
        rules:

          # --- 4xx : erreurs utilisateurs (auth, validation, accès refusé) ---
          - uid: woc-user-errors-loki
            title: "Erreurs utilisateurs WOC (4xx)"
            condition: C
            data:
              - refId: A
                queryType: range
                relativeTimeRange:
                  from: 60
                  to: 0
                datasourceUid: loki-datasource
                model:
                  datasource:
                    type: loki
                    uid: loki-datasource
                  editorMode: code
                  expr: 'sum by (namespace, context_status_code, context_route)(count_over_time({app="backend", container="php-fpm"} | json | channel="user_error" [1m]))'
                  instant: false
                  queryType: range
                  range: true
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  datasource:
                    type: __expr__
                    uid: __expr__
                  refId: B
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                  datasource:
                    type: __expr__
                    uid: __expr__
                  refId: C
            noDataState: OK
            execErrState: Error
            for: 0s
            annotations:
              summary: "Erreur utilisateur détectée sur WOC"
              description: "Namespace : {{ index $labels \"namespace\" }} | Route : {{ index $labels \"context_route\" }} | HTTP {{ index $labels \"context_status_code\" }} reçu sur le backend. Détail (IP, user, message) dans Loki : {app=\"backend\"} | json | channel=`user_error`"
            labels:
              severity: warning
              team: woc
            isPaused: false
            notification_settings:
              receiver: Google Chat WOC

          # --- 5xx : erreurs serveur (exceptions non gérées) ---
          - uid: woc-server-errors-loki
            title: "Erreurs serveur WOC (5xx)"
            condition: C
            data:
              - refId: A
                queryType: range
                relativeTimeRange:
                  from: 60
                  to: 0
                datasourceUid: loki-datasource
                model:
                  datasource:
                    type: loki
                    uid: loki-datasource
                  editorMode: code
                  expr: 'sum by (namespace, context_status_code, context_route, context_exception_class)(count_over_time({app="backend", container="php-fpm"} | json | channel="server_error" [1m]))'
                  instant: false
                  queryType: range
                  range: true
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  type: reduce
                  reducer: last
                  expression: A
                  datasource:
                    type: __expr__
                    uid: __expr__
                  refId: B
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                  datasource:
                    type: __expr__
                    uid: __expr__
                  refId: C
            noDataState: OK
            execErrState: Error
            for: 0s
            annotations:
              summary: "🚨 Erreur serveur critique sur WOC"
              description: "Namespace : {{ index $labels \"namespace\" }} | Route : {{ index $labels \"context_route\" }} | Exception : {{ index $labels \"context_exception_class\" }} → HTTP {{ index $labels \"context_status_code\" }}. Détail complet (message, file, line) dans Loki : {app=\"backend\"} | json | channel=`server_error`"
            labels:
              severity: critical
              team: woc
            isPaused: false
            notification_settings:
              receiver: Google Chat WOC
