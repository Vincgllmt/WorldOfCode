apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-provisioning
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  # ──────────────────────────────────────────────────────────────────────────
  # Template de notification (HTML — Google Chat textParagraph ne supporte
  # pas le markdown *bold*, uniquement les balises HTML <b>, <i>, <br>)
  # ──────────────────────────────────────────────────────────────────────────
  templates.yaml: |
    apiVersion: 1
    templates:
      - orgId: 1
        name: woc-alert-template
        template: |
          {{ define "woc-alert-template" -}}
          {{ if eq .Status "firing" }}<b>🔴 FIRING — WOC Backend</b>{{ else }}<b>✅ RESOLU — WOC Backend</b>{{ end }}
          {{ range .Alerts }}
          <b>{{ .Annotations.summary }}</b>

          <b>📊 Contexte</b>
          Namespace : <b>{{ index .Labels "namespace" }}</b>
          Severite  : <b>{{ index .Labels "severity" }}</b>
          Code HTTP : <b>{{ index .Labels "context_status_code" }}</b>

          <b>📝 Detail</b>
          {{ .Annotations.description }}

          Declenche le {{ .StartsAt.Format "02/01/2006 15:04:05" }}
          {{ end -}}
          {{- end }}

  # ──────────────────────────────────────────────────────────────────────────
  # Contact Point : Google Chat WOC
  # ──────────────────────────────────────────────────────────────────────────
  contactpoints.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: Google Chat WOC
        receivers:
          - uid: google-chat-woc
            type: googlechat
            settings:
              url: "https://chat.googleapis.com/v1/spaces/AAQAsdDI51U/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=FCVHkdyJ8-jM6ixoIGdiSJDaYJBgtan_Mo_wZ8e3TS4"
              message: '{{ template "woc-alert-template" . }}'
            disableResolveMessage: false

  # ──────────────────────────────────────────────────────────────────────────
  # Politique de notification
  # ──────────────────────────────────────────────────────────────────────────
  notificationpolicies.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: Google Chat WOC
        group_by: ["alertname", "namespace"]
        routes: []

  # ──────────────────────────────────────────────────────────────────────────
  # Règles d'alerte
  # ──────────────────────────────────────────────────────────────────────────
  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: woc-errors
        folder: WOC Alerting
        interval: 1m
        rules:

          # --- 4xx : erreurs utilisateurs (auth, validation, accès refusé) ---
          - uid: woc-user-errors-loki
            title: "Erreurs utilisateurs WOC (4xx)"
            condition: B
            data:
              - refId: A
                queryType: range
                relativeTimeRange:
                  from: 60
                  to: 0
                datasourceUid: loki-datasource
                model:
                  datasource:
                    type: loki
                    uid: loki-datasource
                  editorMode: code
                  expr: 'sum by (namespace, context_status_code)(count_over_time({app="backend", container="php-fpm"} | json | channel="user_error" [1m]))'
                  instant: false
                  queryType: range
                  range: true
                  refId: A
              - refId: B
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  hide: false
                  refId: B
                  type: threshold
            noDataState: OK
            execErrState: OK
            for: 0s
            annotations:
              summary: "Erreur utilisateur détectée sur WOC"
              description: "Namespace : {{ index $labels \"namespace\" }} | Code HTTP {{ index $labels \"context_status_code\" }} reçu sur le backend. Consulter les logs Loki : {app=\"backend\"} | json | channel=`user_error` pour le détail (route, IP, user, message)."
            labels:
              severity: warning
              team: woc
            isPaused: false
            notification_settings:
              receiver: Google Chat WOC

          # --- 5xx : erreurs serveur (exceptions non gérées) ---
          - uid: woc-server-errors-loki
            title: "Erreurs serveur WOC (5xx)"
            condition: B
            data:
              - refId: A
                queryType: range
                relativeTimeRange:
                  from: 60
                  to: 0
                datasourceUid: loki-datasource
                model:
                  datasource:
                    type: loki
                    uid: loki-datasource
                  editorMode: code
                  expr: 'sum by (namespace, context_status_code)(count_over_time({app="backend", container="php-fpm"} | json | channel="server_error" [1m]))'
                  instant: false
                  queryType: range
                  range: true
                  refId: A
              - refId: B
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  hide: false
                  refId: B
                  type: threshold
            noDataState: OK
            execErrState: OK
            for: 0s
            annotations:
              summary: "🚨 Erreur serveur critique sur WOC"
              description: "Namespace : {{ index $labels \"namespace\" }} | Exception non gérée → HTTP {{ index $labels \"context_status_code\" }}. Consulter les logs Loki : {app=\"backend\"} | json | channel=`server_error` pour exception_class, file et line."
            labels:
              severity: critical
              team: woc
            isPaused: false
            notification_settings:
              receiver: Google Chat WOC
