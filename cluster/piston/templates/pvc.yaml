apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "woc-piston.fullname" . }}-packages
  annotations:
    # Conserver le volume des runtimes même si la release est désinstallée.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.pvc.storageClass }}
  resources:
    requests:
      storage: {{ .Values.pvc.size }}
