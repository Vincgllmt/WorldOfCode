deploy:vault:
  stage: deploy-services
  needs: []
  variables:
    APP_NAMESPACE: "vault"
    RELEASE_NAME: "vault"
    VAULT_CHART: "hashicorp/vault"
    VAULT_CHART_VERSION: "0.32.0"
    VALUES_FILE: "cluster/vault/values.yaml"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
  script:
    - kubectl create namespace "$APP_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
    - helm repo add hashicorp https://helm.releases.hashicorp.com
    - helm repo update
    - echo "Déploiement de Vault"
    - |
      helm upgrade --install "$RELEASE_NAME" "$VAULT_CHART" \
        --namespace "$APP_NAMESPACE" \
        --version "$VAULT_CHART_VERSION" \
        --values "$VALUES_FILE"

deploy:vault:auto-unseal:
  stage: deploy-services
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
  script:
    - kubectl create namespace vault --dry-run=client -o yaml | kubectl apply -f -
    - echo "--- Création du secret vault-unseal-keys ---"
    - |
      kubectl create secret generic vault-unseal-keys \
        --namespace vault \
        --from-literal=unseal-key-1="$VAULT_UNSEAL_KEY" \
        --dry-run=client -o yaml | kubectl apply -f -
    - echo "--- Déploiement du vault-auto-unseal ---"
    - kubectl apply -f cluster/vault/auto-unseal.yaml
    - echo "vault-auto-unseal déployé."
