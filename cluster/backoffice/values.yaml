replicaCount: 1

image:
  repository: registry.woc:32000/woc-backoffice
  tag: prod-test3
  pullPolicy: IfNotPresent

registry:
  imagePullSecretName: woc-backoffice-regcred

service:
  type: ClusterIP
  port: 2999

containerPort: 2999

env:
  NEXT_PUBLIC_API_URL: "http://woc.woc"
  NEXT_PUBLIC_WOC_URL: "http://woc.woc"
  NEXT_PUBLIC_SOCKET_URL: "http://woc.woc"



ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: backoffice.woc
      paths:
        - path: /
          pathType: Prefix
  tls: []
