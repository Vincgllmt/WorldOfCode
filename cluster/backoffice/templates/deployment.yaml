apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "woc-backoffice.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "woc-backoffice.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "woc-backoffice.name" . }}
    spec:
      # SEC-12 : exécution non-root (node = uid 1000)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: {{ .Values.registry.imagePullSecretName }}
      containers:
      - name: woc-backoffice
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: {{ .Values.containerPort }}
        volumeMounts:
        - name: next-cache
          mountPath: /app/.next/cache
        {{- if .Values.env }}
        env:
        {{- range $key, $value := .Values.env }}
          - name: {{ $key }}
            value: {{ $value | quote }}
        {{- end }}
        {{- end }}
      volumes:
      - name: next-cache
        emptyDir: {}
