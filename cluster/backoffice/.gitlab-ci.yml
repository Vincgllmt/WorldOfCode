deploy:backoffice:
  stage: deploy-apps
  when: manual
  variables:
    BACKOFFICE_NAMESPACE: "backoffice"
    BACKOFFICE_RELEASE_NAME: "woc-backoffice"
    BACKOFFICE_CHART_PATH: "cluster/backoffice"
    IMAGE_PULL_SECRET: "woc-backoffice-regcred"
    REGISTRY_HOST: "registry.woc"
  script:
    - kubectl create namespace "$BACKOFFICE_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
    - echo "Récupération des identifiants de pull depuis le secret du namespace registry"
    - |
      USER_B64=$(kubectl get secret registry-client-credentials -n registry -o jsonpath='{.data.username}')
      PASS_B64=$(kubectl get secret registry-client-credentials -n registry -o jsonpath='{.data.password}')
      REGISTRY_USER=$(echo -n "$USER_B64" | base64 -d)
      REGISTRY_PASSWORD=$(echo -n "$PASS_B64" | base64 -d)
      kubectl create secret docker-registry "$IMAGE_PULL_SECRET" \
        --docker-server="$REGISTRY_HOST" \
        --docker-username="$REGISTRY_USER" \
        --docker-password="$REGISTRY_PASSWORD" \
        --docker-email="ci@example.local" \
        -n "$BACKOFFICE_NAMESPACE" \
        --dry-run=client -o yaml | kubectl apply -f -
    - echo "Déploiement du backoffice Helm (sans --set, valeurs depuis values.yaml)"
    - |
      helm upgrade --install "$BACKOFFICE_RELEASE_NAME" "$BACKOFFICE_CHART_PATH" \
        --namespace "$BACKOFFICE_NAMESPACE" \
        --values cluster/backoffice/values.yaml
