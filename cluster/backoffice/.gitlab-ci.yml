build:backoffice:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  before_script: []
  rules:
    - if: '$CI_COMMIT_TAG =~ /^backoffice-v.*$/'
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - backoffice/**/*
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true
  script:
    - export IMAGE_TAG=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export API_DOMAIN="api-woc-prod.duckdns.org"
      else
        export API_DOMAIN="api-woc-dev.duckdns.org"
      fi
    - echo "{\"auths\":{\"${REGISTRY_HOST}\":{\"auth\":\"$(printf "%s:%s" "${REGISTRY_USER}" "${REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}"> /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/backoffice" \
        --dockerfile "${CI_PROJECT_DIR}/backoffice/Dockerfile.prod" \
        --destination "${REGISTRY_HOST}/backoffice:${IMAGE_TAG}" \
        --build-arg NEXT_PUBLIC_API_URL="https://${API_DOMAIN}" \
        --insecure \
        --skip-tls-verify \
        --cache=true


deploy:backoffice:dev:
  stage: deploy-apps
  extends: .deploy_helm_template
  environment:
    name: dev
  variables:
    APP_NAMESPACE: "dev"
    RELEASE_NAME: "backoffice"
    CHART_PATH: "cluster/backoffice"
    IMAGE_PULL_SECRET: "woc-regcred"
    VALUES_FILE: "cluster/backoffice/values-dev.yaml"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - backoffice/**/*
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true

deploy:backoffice:prod:
  stage: deploy-apps
  extends: .deploy_helm_template
  environment:
    name: production
  variables:
    APP_NAMESPACE: "production"
    RELEASE_NAME: "backoffice"
    CHART_PATH: "cluster/backoffice"
    IMAGE_PULL_SECRET: "woc-regcred"
    VALUES_FILE: "cluster/backoffice/values-prod.yaml"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^backoffice-v.*$/'