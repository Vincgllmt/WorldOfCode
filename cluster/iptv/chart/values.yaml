replicaCount: 1

image:
  repository: registry.woc:32000/iptv-backend
  tag: latest
  pullPolicy: Always

registry:
  imagePullSecretName: woc-regcred

service:
  type: ClusterIP
  port: 8000

containerPort: 8000

env:
  APP_ENV: "production"

vault:
  enabled: true
  role: iptv-backend
  secretPath: secret/data/iptv

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: iptv-api.duckdns.org
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "250m"