apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iptv-backend.fullname" . }}
  labels:
    app: {{ include "iptv-backend.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "iptv-backend.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "iptv-backend.name" . }}
      {{- if .Values.vault.enabled }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-iptv.env: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-iptv.env: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" -}}
          export XTREAM_HOST="{{ .Data.data.XTREAM_HOST }}"
          export XTREAM_USER="{{ .Data.data.XTREAM_USER }}"
          export XTREAM_PASSWORD="{{ .Data.data.XTREAM_PASSWORD }}"
          {{- end }}`}}
      {{- end }}
    spec:
      serviceAccountName: {{ include "iptv-backend.fullname" . }}
      imagePullSecrets:
        - name: {{ .Values.registry.imagePullSecretName }}
      containers:
        - name: iptv-backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}

          {{- if .Values.vault.enabled }}
          command: ["/bin/bash", "-c"]
          args:
            - "source /vault/secrets/iptv.env && exec uvicorn main:app --host 0.0.0.0 --port {{ .Values.containerPort }}"
          {{- end }}

          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 8
            periodSeconds: 10

          {{- if .Values.env }}
          env:
          {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
          {{- end }}
          {{- end }}

          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
