[versions]
agp                  = "8.7.0"
kotlin               = "2.0.0"
coreKtx              = "1.13.1"
composeBom           = "2024.09.00"
lifecycleRuntimeKtx  = "2.8.4"
activityCompose      = "1.9.2"
navigationCompose    = "2.8.0"
koin                 = "3.5.6"
koinCompose          = "3.5.6"
media3               = "1.4.0"
okhttp               = "4.12.0"
moshi                = "1.15.1"
coil                 = "2.7.0"
datastorePrefs       = "1.1.1"
securityCrypto       = "1.1.0-alpha06"
billing              = "7.0.0"
playReview           = "2.0.1"
tvCompose            = "1.0.0"
coroutines           = "1.8.1"
castFramework        = "21.5.0"
mediaRouter          = "1.7.0"
junit                = "4.13.2"
orgJson              = "20240303"

[libraries]
# AndroidX
androidx-core-ktx                    = { group = "androidx.core",              name = "core-ktx",                        version.ref = "coreKtx" }
androidx-lifecycle-viewmodel-ktx     = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-ktx",         version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose",     version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle",         name = "lifecycle-runtime-compose",       version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose            = { group = "androidx.activity",          name = "activity-compose",                version.ref = "activityCompose" }
androidx-navigation-compose          = { group = "androidx.navigation",        name = "navigation-compose",              version.ref = "navigationCompose" }
androidx-datastore-preferences       = { group = "androidx.datastore",         name = "datastore-preferences",           version.ref = "datastorePrefs" }
androidx-security-crypto             = { group = "androidx.security",          name = "security-crypto",                 version.ref = "securityCrypto" }

# Compose BOM + modules (version managed by BOM)
androidx-compose-bom                  = { group = "androidx.compose",          name = "compose-bom",                    version.ref = "composeBom" }
androidx-compose-ui                   = { group = "androidx.compose.ui",       name = "ui" }
androidx-compose-ui-tooling           = { group = "androidx.compose.ui",       name = "ui-tooling" }
androidx-compose-ui-tooling-preview   = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
androidx-compose-material3            = { group = "androidx.compose.material3",name = "material3" }
androidx-compose-icons-extended       = { group = "androidx.compose.material", name = "material-icons-extended" }

# TV Compose
androidx-tv-material                 = { group = "androidx.tv",                name = "tv-material",                     version.ref = "tvCompose" }
androidx-tv-foundation               = { group = "androidx.tv",                name = "tv-foundation",                   version.ref = "tvCompose" }

# Media3
androidx-media3-exoplayer            = { group = "androidx.media3",            name = "media3-exoplayer",                version.ref = "media3" }
androidx-media3-hls                  = { group = "androidx.media3",            name = "media3-exoplayer-hls",            version.ref = "media3" }
androidx-media3-dash                 = { group = "androidx.media3",            name = "media3-exoplayer-dash",           version.ref = "media3" }
androidx-media3-ui                   = { group = "androidx.media3",            name = "media3-ui",                       version.ref = "media3" }
androidx-media3-session              = { group = "androidx.media3",            name = "media3-session",                  version.ref = "media3" }

# Koin
koin-android                         = { group = "io.insert-koin",             name = "koin-android",                    version.ref = "koin" }
koin-androidx-compose                = { group = "io.insert-koin",             name = "koin-androidx-compose",           version.ref = "koinCompose" }

# Network
okhttp                               = { group = "com.squareup.okhttp3",       name = "okhttp",                          version.ref = "okhttp" }
moshi-kotlin                         = { group = "com.squareup.moshi",         name = "moshi-kotlin",                    version.ref = "moshi" }

# Image loading
coil-compose                         = { group = "io.coil-kt",                 name = "coil-compose",                    version.ref = "coil" }

# Billing
billing-ktx                          = { group = "com.android.billingclient", name = "billing-ktx",                     version.ref = "billing" }
play-review-ktx                      = { group = "com.google.android.play",   name = "review-ktx",                      version.ref = "playReview" }

# Coroutines
kotlinx-coroutines-android           = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android",      version.ref = "coroutines" }

# Cast
cast-framework                       = { group = "com.google.android.gms",    name = "play-services-cast-framework",    version.ref = "castFramework" }
media-router                         = { group = "androidx.mediarouter",       name = "mediarouter",                     version.ref = "mediaRouter" }

# Test (JVM unit tests — voir CLAUDE.md §4)
junit                                = { group = "junit",                      name = "junit",                           version.ref = "junit" }
kotlinx-coroutines-test              = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-test",         version.ref = "coroutines" }
# Implémentation réelle d'org.json : sur le classpath de test, elle remplace le
# stub d'android.jar qui lève « not mocked » sur JSONArray/JSONObject.
org-json                             = { group = "org.json",                   name = "json",                            version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library     = { id = "com.android.library",     version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
