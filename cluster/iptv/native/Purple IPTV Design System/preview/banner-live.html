<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
  body { padding: 24px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  .ttl { font-weight: 700; font-size: 14px; }
  .note { color: var(--fg-3); font-size: 12px; }

  /* Trial banner — full bleed lavender */
  .trial { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px; background: linear-gradient(180deg, #B881FF, #A66BFC); border-radius: 14px; }
  .trial .left { display: flex; align-items: center; gap: 14px; color: #fff; font: 600 16px var(--font-display); }
  .trial .left svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; }
  .trial .pill { border: 1.5px solid #fff; border-radius: 999px; padding: 10px 22px; color: #fff; font: 700 13px var(--font-display); letter-spacing: 0.08em; }

  .row { display: flex; gap: 12px; align-items: center; margin-top: 14px; }
  .badge-live { background: #B36BFC; color: #fff; font: 800 12px var(--font-display); letter-spacing: 0.06em; padding: 6px 12px; border-radius: 8px; }
  .live-dot-row { display: flex; align-items: center; gap: 6px; color: #FF3B30; font: 800 12px var(--font-display); letter-spacing: 0.08em; }
  .live-dot { width: 8px; height: 8px; border-radius: 999px; background: #FF3B30; box-shadow: 0 0 8px #FF3B30; }
  .timeprog { flex: 1; height: 4px; background: rgba(255,255,255,0.12); border-radius: 999px; overflow: hidden; }
  .timeprog .fill { width: 18%; height: 100%; background: #B36BFC; }
  .timetxt { color: var(--fg-3); font: 400 12px var(--font-mono); }
</style></head><body>
  <div class="top">
    <div class="ttl">Trial banner · LIVE badges · progress</div>
    <div class="note">mobile chrome ↑ · player overlays ↓</div>
  </div>
  <div class="trial">
    <div class="left">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 3h6M12 3v3"/></svg>
      Free trial: 3 day(s) remaining.
    </div>
    <div class="pill">ACTIVATE</div>
  </div>
  <div class="row">
    <span class="live-dot-row"><span class="live-dot"></span>LIVE</span>
    <span class="badge-live">EN DIRECT</span>
    <span class="timetxt">15:55</span>
    <div class="timeprog"><div class="fill"></div></div>
    <span class="timetxt">18:00</span>
  </div>
</body></html>
