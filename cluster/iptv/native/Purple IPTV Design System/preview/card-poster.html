<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
  body { padding: 28px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  .ttl { font-weight: 700; font-size: 14px; }
  .note { color: var(--fg-3); font-size: 12px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .lab { font-size: 10px; color: var(--fg-3); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; }
  .poster { aspect-ratio: 2/3; border-radius: 16px; position: relative; overflow: hidden; box-shadow: 0 12px 32px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.04); background: linear-gradient(140deg, #5a2484, #1B0E36); }
  .rating { position: absolute; left: 8px; bottom: 8px; background: #B36BFC; color: #fff; font: 600 11px var(--font-display); padding: 4px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; }
  .heart { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; }
  .heart svg { width: 100%; height: 100%; stroke: rgba(255,255,255,0.85); stroke-width: 2; fill: none; }
  .heart.fav svg { fill: #B36BFC; stroke: #B36BFC; }
  .tilelabel { font: 600 12px var(--font-display); color: var(--fg-1); margin-top: 6px; line-height: 1.3; }
</style></head><body>
  <div class="top">
    <div class="ttl">Poster card · 2:3 · rating chip · favorite</div>
    <div class="note">heart top-right · rating bottom-left</div>
  </div>
  <div class="row">
    <div class="col">
      <div class="poster" style="background: linear-gradient(140deg, #7a2f5c, #1B0E36);">
        <span class="rating">★ 5.7</span>
        <span class="heart"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10.5C5 7 7.5 5 10 5c1.5 0 3 1 2 2.5C13 6 14.5 5 16 5c2.5 0 5 2 5 5.5 0 6-7 10.5-9 10.5z"/></svg></span>
      </div>
      <div class="tilelabel">The Carpenter's Son</div>
      <div class="lab">Default</div>
    </div>
    <div class="col">
      <div class="poster" style="background: linear-gradient(140deg, #2c4a72, #1B0E36);">
        <span class="rating">★ 6.35</span>
        <span class="heart fav"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10.5C5 7 7.5 5 10 5c1.5 0 3 1 2 2.5C13 6 14.5 5 16 5c2.5 0 5 2 5 5.5 0 6-7 10.5-9 10.5z"/></svg></span>
      </div>
      <div class="tilelabel">Si j'en avais la force</div>
      <div class="lab">Favorited</div>
    </div>
    <div class="col">
      <div class="poster" style="background: linear-gradient(140deg, #804a2a, #1B0E36); transform: scale(1.04); outline: 3px solid #B36BFC; outline-offset: -3px; box-shadow: 0 0 28px rgba(179,107,252,0.7), 0 12px 32px rgba(0,0,0,0.55);">
        <span class="rating">★ 6.222</span>
        <span class="heart"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10.5C5 7 7.5 5 10 5c1.5 0 3 1 2 2.5C13 6 14.5 5 16 5c2.5 0 5 2 5 5.5 0 6-7 10.5-9 10.5z"/></svg></span>
      </div>
      <div class="tilelabel">Ladies First</div>
      <div class="lab">Focused</div>
    </div>
    <div class="col">
      <div class="poster" style="background: linear-gradient(140deg, #1f2433, #0f0820);">
        <span class="rating">★ 6.4</span>
        <span class="heart"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10.5C5 7 7.5 5 10 5c1.5 0 3 1 2 2.5C13 6 14.5 5 16 5c2.5 0 5 2 5 5.5 0 6-7 10.5-9 10.5z"/></svg></span>
      </div>
      <div class="tilelabel">Le Mage du Kremlin</div>
      <div class="lab">Default</div>
    </div>
  </div>
</body></html>
