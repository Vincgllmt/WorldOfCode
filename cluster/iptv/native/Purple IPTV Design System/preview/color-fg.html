<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
  body { padding: 28px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .swatch { padding: 18px; border-radius: 14px; background: var(--bg-2); display:flex; flex-direction:column; gap:6px; }
  .text { font-size: 22px; font-weight: 700; }
  .meta { font-size: 11px; color: var(--fg-3); font-family: var(--font-mono); }
  .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .ttl { font-weight: 700; font-size: 14px; }
  .note { color: var(--fg-3); font-size: 12px; }
</style></head><body>
  <div class="top">
    <div class="ttl">Foreground / Text</div>
    <div class="note">on --bg-1 / --bg-2</div>
  </div>
  <div class="grid">
    <div class="swatch"><div class="text" style="color:#FFFFFF">Primary headline</div><div class="meta">--fg-1 · #FFFFFF</div></div>
    <div class="swatch"><div class="text" style="color:rgba(255,255,255,0.78)">Secondary body copy</div><div class="meta">--fg-2 · rgba 255/.78</div></div>
    <div class="swatch"><div class="text" style="color:rgba(255,255,255,0.55)">Meta / placeholder</div><div class="meta">--fg-3 · rgba 255/.55</div></div>
    <div class="swatch"><div class="text" style="color:rgba(255,255,255,0.32)">Disabled, dividers</div><div class="meta">--fg-4 · rgba 255/.32</div></div>
  </div>
</body></html>
