<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
  body { padding: 28px; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .specimen { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line-1); padding-bottom: 14px; }
  .specimen:last-child { border-bottom: none; padding-bottom: 0; }
  .meta { color: var(--fg-3); font-size: 11px; font-family: var(--font-mono); flex: 0 0 auto; }
  .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .ttl { font-weight: 700; font-size: 14px; }
  .note { color: var(--fg-3); font-size: 12px; }
</style></head><body>
  <div class="top">
    <div class="ttl">Type · Display + Headings</div>
    <div class="note">Poppins · 800/700/600</div>
  </div>
  <div class="stack">
    <div class="specimen">
      <div style="font: 800 56px/1.05 var(--font-display); letter-spacing:-0.02em;">Premium streaming</div>
      <div class="meta">display · 56/800</div>
    </div>
    <div class="specimen">
      <div style="font: 700 36px/1.1 var(--font-display); letter-spacing:-0.02em;">Continue watching</div>
      <div class="meta">h1 · 36/700</div>
    </div>
    <div class="specimen">
      <div style="font: 700 26px/1.2 var(--font-display);">Trending now</div>
      <div class="meta">h2 · 26/700</div>
    </div>
    <div class="specimen">
      <div style="font: 600 20px/1.3 var(--font-display);">Le Mage du Kremlin</div>
      <div class="meta">h3 · 20/600</div>
    </div>
  </div>
</body></html>
