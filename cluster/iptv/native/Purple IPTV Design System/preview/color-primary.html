<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
  body { padding: 28px; }
  .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 84px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); }
  .nm { color: var(--fg-2); font-size: 11px; font-weight: 600; }
  .hx { color: var(--fg-3); font-size: 10px; font-family: var(--font-mono); }
  .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .pri-name { font-weight: 700; font-size: 14px; }
  .pri-note { color: var(--fg-3); font-size: 12px; }
</style></head><body>
  <div class="top">
    <div class="pri-name">Lavender — Brand &amp; Interactive</div>
    <div class="pri-note">CTAs · focus · selection · wordmark only</div>
  </div>
  <div class="swatches">
    <div class="sw"><div class="chip" style="background:#F5ECFF"></div><div class="nm">50</div><div class="hx">#F5ECFF</div></div>
    <div class="sw"><div class="chip" style="background:#E7D4FF"></div><div class="nm">100</div><div class="hx">#E7D4FF</div></div>
    <div class="sw"><div class="chip" style="background:#D2B0FF"></div><div class="nm">200</div><div class="hx">#D2B0FF</div></div>
    <div class="sw"><div class="chip" style="background:#BF8FFF"></div><div class="nm">300</div><div class="hx">#BF8FFF</div></div>
    <div class="sw"><div class="chip" style="background:#B36BFC; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06), 0 0 24px rgba(179,107,252,0.45);"></div><div class="nm" style="color:var(--purple-300)">400 ★</div><div class="hx">#B36BFC</div></div>
    <div class="sw"><div class="chip" style="background:#A855F7"></div><div class="nm">500</div><div class="hx">#A855F7</div></div>
    <div class="sw"><div class="chip" style="background:#8C3DE8"></div><div class="nm">600</div><div class="hx">#8C3DE8</div></div>
    <div class="sw"><div class="chip" style="background:#6B22C0"></div><div class="nm">700</div><div class="hx">#6B22C0</div></div>
  </div>
</body></html>
