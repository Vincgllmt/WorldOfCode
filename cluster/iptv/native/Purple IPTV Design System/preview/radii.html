<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
  body { padding: 28px; }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { background: var(--bg-3); box-shadow: inset 0 0 0 1px rgba(179,107,252,0.25); width: 92px; height: 92px; display: flex; align-items: center; justify-content: center; }
  .nm { font-size: 11px; color: var(--fg-2); font-weight: 600; }
  .px { font-size: 10px; color: var(--fg-3); font-family: var(--font-mono); }
  .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .ttl { font-weight: 700; font-size: 14px; }
  .note { color: var(--fg-3); font-size: 12px; }
</style></head><body>
  <div class="top">
    <div class="ttl">Corner Radii</div>
    <div class="note">xs → pill</div>
  </div>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:6px"></div><div class="nm">xs</div><div class="px">6</div></div>
    <div class="item"><div class="box" style="border-radius:10px"></div><div class="nm">sm</div><div class="px">10</div></div>
    <div class="item"><div class="box" style="border-radius:14px"></div><div class="nm">md</div><div class="px">14</div></div>
    <div class="item"><div class="box" style="border-radius:18px"></div><div class="nm">lg</div><div class="px">18</div></div>
    <div class="item"><div class="box" style="border-radius:24px"></div><div class="nm">xl</div><div class="px">24</div></div>
    <div class="item"><div class="box" style="border-radius:999px"></div><div class="nm">pill</div><div class="px">∞</div></div>
  </div>
</body></html>
