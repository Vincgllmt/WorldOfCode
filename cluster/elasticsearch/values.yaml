image:
  repository: docker.elastic.co/elasticsearch/elasticsearch
  tag: "8.13.4"
  pullPolicy: IfNotPresent

vault:
  secretPath: "secret/data/elasticsearch"

persistence:
  size: 10Gi
  storageClass: local-path-retain

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "500m"

javaOpts: "-Xms512m -Xmx512m"

service:
  type: ClusterIP
  port: 9200
