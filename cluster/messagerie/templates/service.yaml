apiVersion: v1
kind: Service
metadata:
  name: {{ include "woc-messagerie.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "woc-messagerie.name" . }}
  ports:
    - port: {{ .Values.service.port }}              # 8081
      targetPort: {{ .Values.service.targetPort }}  # 3000
