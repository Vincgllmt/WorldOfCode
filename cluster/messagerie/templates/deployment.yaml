apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "woc-messagerie.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "woc-messagerie.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "woc-messagerie.name" . }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "app"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/messagerie"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ "{{- with secret \"secret/data/messagerie\" -}}" }}
          export DB_PASS={{ "\"{{ .Data.data.password }}\"" }}
          {{ "{{- end -}}" }}
    spec:
      # 1. Activation optionnelle du hostNetwork
      {{- if .Values.hostNetwork }}
      hostNetwork: {{ .Values.hostNetwork }}
      # AJOUT INDISPENSABLE POUR QUE LA MESSAGERIE PUISSE PARLER À MYSQL :
      dnsPolicy: ClusterFirstWithHostNet 
      {{- end }}
      
      # 2. Ajout du nodeSelector pour forcer le pod sur un nœud précis
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}

      imagePullSecrets:
        - name: {{ .Values.registry.imagePullSecretName }}
      containers:
        - name: messagerie
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args: [". /vault/secrets/config && exec npm run start"]
          ports:
            - containerPort: {{ .Values.containerPort }}
          
          volumeMounts:
            - name: jwt-keys-vol
              mountPath: /app/src/config/jwt
              readOnly: true

          env:
            - name: PORT
              value: {{ .Values.env.PORT | quote }}
            - name: CORS_ORIGIN
              value: {{ .Values.env.CORS_ORIGIN | quote }}
            
            # 3. Injection de l'IP publique pour MediaSoup
            {{- if .Values.mediasoup }}
            {{- if .Values.mediasoup.announcedIp }}
            - name: MEDIASOUP_ANNOUNCED_IP
              value: {{ .Values.mediasoup.announcedIp | quote }}
            {{- end }}
            {{- end }}

            - name: DB_HOST
              value: {{ .Values.database.host | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_USER
              value: {{ .Values.database.user | quote }}
            - name: DB_NAME
              value: {{ .Values.database.name | quote }}

      volumes:
        - name: jwt-keys-vol
          secret:
            secretName: jwt-keys