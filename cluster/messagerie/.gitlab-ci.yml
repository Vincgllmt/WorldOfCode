deploy:messagerie:dev:
  stage: deploy-apps
  extends: .deploy_helm_template
  environment:
    name: dev
  variables:
    APP_NAMESPACE: "dev"
    RELEASE_NAME: "messagerie"
    CHART_PATH: "cluster/messagerie"
    IMAGE_PULL_SECRET: "woc-regcred"
    VALUES_FILE: "cluster/messagerie/values-dev.yaml"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - messagerie/**/*
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true

deploy:messagerie:prod:
  stage: deploy-apps
  extends: .deploy_helm_template
  environment:
    name: production
  variables:
    APP_NAMESPACE: "production"
    RELEASE_NAME: "messagerie"
    CHART_PATH: "cluster/messagerie"
    IMAGE_PULL_SECRET: "woc-regcred"
    VALUES_FILE: "cluster/messagerie/values-prod.yaml"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^messagerie-v.*$/'