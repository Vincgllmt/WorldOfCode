build:messagerie:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^messagerie-v.*$/'
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - messagerie/**/*
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true
  script:
    - export IMAGE_TAG=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - echo "{\"auths\":{\"${REGISTRY_HOST}\":{\"auth\":\"$(printf "%s:%s" "${REGISTRY_USER}" "${REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - echo "Build et Push vers ${REGISTRY_HOST}/messagerie:${IMAGE_TAG}"
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/messagerie" \
        --dockerfile "${CI_PROJECT_DIR}/messagerie/Dockerfile.prod" \
        --destination "${REGISTRY_HOST}/messagerie:${IMAGE_TAG}" \
        --insecure \
        --skip-tls-verify \
        --cache=true


