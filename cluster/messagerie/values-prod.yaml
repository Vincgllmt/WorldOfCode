replicaCount: 1

image:
  # CORRECTION : Localhost pour le NodePort
  repository: registry.woc:32000/messagerie
  pullPolicy: Always

registry:
  imagePullSecretName: woc-regcred

service:
  type: ClusterIP
  port: 8081        # Port exposé dans Kubernetes (utilisé par le Nginx du Backend)
  targetPort: 3000

containerPort: 3000

database:
  secretName: woc-messagerie-db
  host: "mysql"
  port: "3306"
  user: "application"
  password: "password"
  name: "projet_web"

env:
  PORT: "3000"
  CORS_ORIGIN: "https://woc-prod.duckdns.org" 

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: api-woc-prod.duckdns.org
      paths:
        - path: /api/messaging
          pathType: Prefix
