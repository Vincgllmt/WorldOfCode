replicaCount: 1

vault:
  secretPath: "secret/data/production/messagerie"

image:
  # CORRECTION : Localhost pour le NodePort
  repository: registry.woc:32000/messagerie
  pullPolicy: Always

registry:
  imagePullSecretName: woc-regcred

service:
  type: ClusterIP
  port: 8081
  targetPort: 3001

containerPort: 3001

# Configuration réseau pour MediaSoup (WebRTC)
hostNetwork: true

# Fixer le pod sur le nœud kube-worker-01
nodeSelector:
  kubernetes.io/hostname: "kube-worker-01"

mediasoup:
  announcedIp: "51.178.143.54"

database:
  host: "mysql"
  port: "3306"
  user: "application"
  name: "projet_web"

env:
  PORT: "3001"
  CORS_ORIGIN: "https://worldofcode.duckdns.org" 

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: api-worldofcode.duckdns.org
      paths:
        - path: /socket.io
          pathType: Prefix