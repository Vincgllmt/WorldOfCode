replicaCount: 1

image:
  # CORRECTION : Localhost pour le NodePort
  repository: registry.woc:32000/messagerie
  pullPolicy: Always

registry:
  imagePullSecretName: woc-regcred

service:
  type: ClusterIP
  port: 8081
  targetPort: 3000

containerPort: 3000

# Configuration réseau pour MediaSoup (WebRTC)
# hostNetwork: true

# # Fixer le pod sur le nœud kube-worker-01
# nodeSelector:
#   kubernetes.io/hostname: "kube-worker-01"

# mediasoup:
#   announcedIp: "51.178.143.54"

database:
  secretName: woc-messagerie-db
  host: "mysql"
  port: "3306"
  user: "application"
  password: "password"
  name: "projet_web"

env:
  PORT: "3000"
  CORS_ORIGIN: "https://woc-dev.duckdns.org" 

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: api-woc-dev.duckdns.org
      paths:
        - path: /socket.io
          pathType: Prefix

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "250m"