# values.yaml

# Service exposé
service:
  type: NodePort
  port: 5000
  nodePort: 32000

persistence:
  enabled: true
  size: 10Gi
  storageClass: longhorn
  deleteEnabled: true


secrets:
  htpasswd: ""

ingress:
  enabled: false


extraEnvVars:
  - name: REGISTRY_STORAGE_DELETE_ENABLED
    value: "true"
