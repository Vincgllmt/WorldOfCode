apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: k6-stress
  namespace: k6
spec:
  parallelism: 1
  script:
    configMap:
      name: k6-scripts
      file: stress.js
  runner:
    image: ${K6_IMAGE}
    env:
      - name: BASE_URL
        value: "${BASE_URL}"
      - name: K6_PROMETHEUS_RW_SERVER_URL
        value: "${VM_URL}"
      - name: K6_PROMETHEUS_RW_NATIVE_HISTOGRAMS
        value: "true"
    envFrom:
      - secretRef:
          name: k6-credentials
