replicaCount: 1

server:
  type: builtin

vault:
  # Base partagée projet_web : credential DB réutilisé depuis le secret du backend.
  dbSecretPath: "secret/data/backend"
  # Secret propre à Code Arena (APP_SECRET).
  secretPath: "secret/data/code-arena"

image:
  repository: registry.woc:32000/code-arena
  pullPolicy: IfNotPresent

registry:
  imagePullSecretName: woc-regcred

service:
  type: ClusterIP
  port: 8082

containerPort: 8082

env:
  APP_ENV: "dev"
  CORS_ALLOW_ORIGIN: "^https?://(woc-dev\\.duckdns\\.org|api-woc-dev\\.duckdns\\.org|localhost|127\\.0\\.0\\.1)(:[0-9]+)?$"
  PISTON_URL: "http://piston.dev.svc.cluster.local:2000"
  DEFAULT_URI: "https://api-woc-dev.duckdns.org"

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: api-woc-dev.duckdns.org
      paths:
        - path: /api/arena
          pathType: Prefix

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"
