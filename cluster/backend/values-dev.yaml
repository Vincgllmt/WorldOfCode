replicaCount: 1

migrations:
  enabled: true

vault:
  secretPath: "secret/data/backend"

image:
  repository: registry.woc:32000/backend
  tag: ada1bd67
  pullPolicy: IfNotPresent

registry:
  imagePullSecretName: woc-regcred

service:
  type: ClusterIP
  port: 8090

containerPort: 8090

database:
  secretName: woc-db
  url: "mysql://application:password@mysql:3306/projet_web"

env:
  APP_ENV: "prod"
  CORS_ALLOW_ORIGIN: "^https?://(woc-dev\\.duckdns\\.org|api-woc-dev\\.duckdns\\.org|backoffice-woc-dev\\.duckdns\\.org|localhost|127\\.0\\.0\\.1)(:[0-9]+)?$"
  MINIO_ENDPOINT: "http://minio.dev.svc.cluster.local:9000"
  MINIO_ACCESS_KEY: "admin"
  MINIO_SECRET_KEY: "admin1234"
  MINIO_BUCKET: "uploads"
  MINIO_PUBLIC_URL: "https://api-woc-dev.duckdns.org/uploads"
  RESET_PASSWORD_URL: "https://woc-dev.duckdns.org"
  MESSAGERIE_URL: "http://messagerie.dev.svc.cluster.local:8081"

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: api-woc-dev.duckdns.org
      paths:
        - path: /api
          pathType: Prefix
        - path: /uploads
          pathType: Prefix

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"
