replicaCount: 1

migrations:
  enabled: false

server:
  type: fpm

vault:
  secretPath: "secret/data/production/backend"
  minioSecretPath: "secret/data/production/minio"

image:
  repository: registry.woc:32000/backend
  pullPolicy: IfNotPresent

registry:
  imagePullSecretName: woc-regcred

service:
  type: ClusterIP
  port: 8090

containerPort: 8090

database:
  secretName: woc-db
  url: "mysql://application:password@mysql:3306/projet_web"

env:
  APP_ENV: "prod"
  CORS_ALLOW_ORIGIN: "^https?://(woc-prod\\.duckdns\\.org|api-woc-prod\\.duckdns\\.org|localhost|127\\.0\\.0\\.1)(:[0-9]+)?$"
  MINIO_ENDPOINT: "http://minio.production.svc.cluster.local:9000"
  MINIO_ACCESS_KEY: "admin"
  MINIO_BUCKET: "uploads"
  MINIO_PUBLIC_URL: "https://api-woc-prod.duckdns.org/uploads"
  RESET_PASSWORD_URL: "https://woc-prod.duckdns.org"
  MESSAGERIE_URL: "http://messagerie.production.svc.cluster.local:8081"

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: api-woc-prod.duckdns.org
      paths:
        - path: /api
          pathType: Prefix
        - path: /uploads
          pathType: Prefix
