replicaCount: 3

migrations:
  # Migration inline dans le conteneur php-fpm désactivée : 3 replicas -> course.
  enabled: false
  # Migration via Helm hook pre-install/pre-upgrade (Job unique). Voir templates/migration-job.yaml.
  hook: true

server:
  type: fpm

vault:
  secretPath: "secret/data/production/backend"
  minioSecretPath: "secret/data/production/minio"
  elasticsearchSecretPath: "secret/data/elasticsearch"

image:
  repository: registry.woc:32000/backend
  pullPolicy: IfNotPresent

registry:
  imagePullSecretName: woc-regcred

service:
  type: ClusterIP
  port: 8090

containerPort: 8090

database:
  secretName: woc-db
  url: "mysql://application:password@mysql:3306/projet_web"

env:
  APP_ENV: "prod"
  CORS_ALLOW_ORIGIN: "^https?://(worldofcode\\.duckdns\\.org|api-worldofcode\\.duckdns\\.org|backoffice-worldofcode\\.duckdns\\.org|localhost|127\\.0\\.0\\.1)(:[0-9]+)?$"
  MINIO_ENDPOINT: "http://minio.production.svc.cluster.local:9000"
  MINIO_ACCESS_KEY: "admin"
  MINIO_BUCKET: "uploads"
  MINIO_PUBLIC_URL: "https://api-worldofcode.duckdns.org/uploads"
  RESET_PASSWORD_URL: "https://worldofcode.duckdns.org"
  MESSAGERIE_URL: "http://messagerie.production.svc.cluster.local:8081"
  ELASTICSEARCH_HOST: "http://elasticsearch.elasticsearch.svc.cluster.local:9200"
  ELASTICSEARCH_USERNAME: "elastic"

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: api-worldofcode.duckdns.org
      paths:
        - path: /api
          pathType: Prefix
        - path: /uploads
          pathType: Prefix
