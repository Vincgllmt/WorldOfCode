replicaCount: 1

image:
  repository: registry.woc:32000/backend
  pullPolicy: IfNotPresent

registry:
  imagePullSecretName: woc-regcred

service:
  type: ClusterIP
  port: 8090

containerPort: 8090

database:
  secretName: woc-db
  url: "mysql://application:password@mysql:3306/projet_web"

env:
  APP_ENV: "prod"
  CORS_ALLOW_ORIGIN: "^https?://(woc\\.production|api\\.production\\.woc|localhost|127\\.0\\.0\\.1)(:[0-9]+)?$"
  MINIO_ENDPOINT: "http://minio.production.svc.cluster.local:9000"
  MINIO_ACCESS_KEY: "admin" 
  MINIO_SECRET_KEY: "admin1234"
  MINIO_BUCKET: "uploads"
  MINIO_PUBLIC_URL: "https://api.production.woc/uploads"

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: api.production.woc
      paths:
        - path: /api
          pathType: Prefix
