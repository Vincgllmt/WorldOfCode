{{- if .Values.migrations.hook }}
# Job de migration Doctrine lancé automatiquement AVANT chaque déploiement
# (helm hook pre-install + pre-upgrade). Un seul pod : évite la course entre
# les {{ .Values.replicaCount }} replicas du Deployment (migrations non concurrency-safe).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "woc-backend.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: "app"
        vault.hashicorp.com/agent-inject-secret-config: "{{ .Values.vault.secretPath }}"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ print "{{- with secret \"" .Values.vault.secretPath "\" -}}" }}
          export DATABASE_URL={{ "\"{{ .Data.data.url }}\"" }}
          {{ "{{- end -}}" }}
    spec:
      # SEC-12 : exécution non-root (www-data = uid 33)
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      imagePullSecrets:
        - name: {{ .Values.registry.imagePullSecretName }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          workingDir: /var/www/backend
          command: ["/bin/sh", "-c"]
          args:
            - |
              . /vault/secrets/config
              echo "→ Attente de la base de données..."
              until php bin/console doctrine:query:sql "SELECT 1" > /dev/null 2>&1; do sleep 2; done
              echo "→ Exécution des migrations..."
              php bin/console doctrine:migrations:migrate --no-interaction
              echo "→ Migrations terminées."
          env:
            - name: APP_ENV
              value: {{ .Values.env.APP_ENV | quote }}
          volumeMounts:
            - name: jwt-keys
              mountPath: /var/www/backend/config/jwt
              readOnly: true
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
{{- end }}
