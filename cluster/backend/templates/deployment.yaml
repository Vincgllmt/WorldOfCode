apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "woc-backend.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "woc-backend.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "woc-backend.name" . }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "app"
        vault.hashicorp.com/agent-inject-secret-config: "{{ .Values.vault.secretPath }}"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ print "{{- with secret \"" .Values.vault.secretPath "\" -}}" }}
          export DATABASE_URL={{ "\"{{ .Data.data.url }}\"" }}
          {{ "{{- end -}}" }}
    spec:
      imagePullSecrets:
      - name: {{ .Values.registry.imagePullSecretName }}

      containers:
        # --- Conteneur PHP-FPM ---
        - name: php-fpm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          {{- if .Values.migrations.enabled }}
          args:
            - |
              . /vault/secrets/config
              echo "→ Attente de la base de données..."
              until php bin/console doctrine:query:sql "SELECT 1" > /dev/null 2>&1; do sleep 2; done
              echo "→ Exécution des migrations..."
              php bin/console doctrine:migrations:migrate --no-interaction
              echo "→ Migrations terminées. Démarrage PHP-FPM..."
              exec /usr/local/bin/entrypoint-prod.sh php-fpm
          {{- else }}
          args: [". /vault/secrets/config && exec php-fpm"]
          {{- end }}
          ports:
            - containerPort: 9000
          env:
            - name: APP_ENV
              value: {{ .Values.env.APP_ENV | quote }}
            - name: CORS_ALLOW_ORIGIN
              value: {{ .Values.env.CORS_ALLOW_ORIGIN | quote }}
            - name: RESET_PASSWORD_URL
              value: {{ .Values.env.RESET_PASSWORD_URL | quote }}
            - name: MESSAGERIE_URL
              value: {{ .Values.env.MESSAGERIE_URL | quote }}
            - name: MINIO_ENDPOINT
              value: {{ .Values.env.MINIO_ENDPOINT | quote }}
            - name: MINIO_ACCESS_KEY
              value: {{ .Values.env.MINIO_ACCESS_KEY | quote }}
            - name: MINIO_SECRET_KEY
              value: {{ .Values.env.MINIO_SECRET_KEY | quote }}
            - name: MINIO_BUCKET
              value: {{ .Values.env.MINIO_BUCKET | quote }}
            - name: MINIO_PUBLIC_URL
              value: {{ .Values.env.MINIO_PUBLIC_URL | quote }}

          # Montage des clés pour PHP
          volumeMounts:
            - name: jwt-keys
              mountPath: /var/www/backend/config/jwt
              readOnly: true

        # --- Conteneur Nginx ---
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 8090
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf

      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "woc-backend.fullname" . }}-nginx-config
            items:
              - key: nginx.conf
                path: nginx.conf
        
        - name: jwt-keys
          secret:
            secretName: jwt-keys