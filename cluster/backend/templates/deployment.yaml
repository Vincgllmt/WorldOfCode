apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "woc-backend.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "woc-backend.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "woc-backend.name" . }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "app"
        vault.hashicorp.com/agent-inject-secret-config: "{{ .Values.vault.secretPath }}"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ print "{{- with secret \"" .Values.vault.secretPath "\" -}}" }}
          export DATABASE_URL={{ "\"{{ .Data.data.url }}\"" }}
          {{ "{{ if .Data.data.appSecret }}" }}
          export APP_SECRET={{ "\"{{ .Data.data.appSecret }}\"" }}
          {{ "{{ end }}" }}
          {{ "{{ if .Data.data.jwtPassphrase }}" }}
          export JWT_PASSPHRASE={{ "\"{{ .Data.data.jwtPassphrase }}\"" }}
          {{ "{{ end }}" }}
          {{ if .Data.data.mailerDsn }}
          export MAILER_DSN={{ "\"{{ .Data.data.mailerDsn }}\"" }}
          {{ end }}
          {{ if .Data.data.INTERNAL_SECRET }}
          export INTERNAL_SECRET={{ "\"{{ .Data.data.INTERNAL_SECRET }}\"" }}
          {{ end }}
          {{ "{{- end -}}" }}
        vault.hashicorp.com/agent-inject-secret-minio: "{{ .Values.vault.minioSecretPath }}"
        vault.hashicorp.com/agent-inject-template-minio: |
          {{ print "{{- with secret \"" .Values.vault.minioSecretPath "\" -}}" }}
          export MINIO_SECRET_KEY={{ "\"{{ .Data.data.rootPassword }}\"" }}
          {{ "{{- end -}}" }}
        vault.hashicorp.com/agent-inject-secret-elasticsearch: "{{ .Values.vault.elasticsearchSecretPath }}"
        vault.hashicorp.com/agent-inject-template-elasticsearch: |
          {{ print "{{- with secret \"" .Values.vault.elasticsearchSecretPath "\" -}}" }}
          export ELASTICSEARCH_PASSWORD={{ "\"{{ .Data.data.password }}\"" }}
          {{ "{{- end -}}" }}
    spec:
      # SEC-12 : aucun conteneur ne tourne en root
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: {{ .Values.registry.imagePullSecretName }}

      containers:
        # --- Conteneur PHP-FPM ---
        - name: php-fpm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: 33
            runAsGroup: 33
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-c"]
          {{- if .Values.migrations.enabled }}
          args:
            - |
              . /vault/secrets/config
              . /vault/secrets/minio
              . /vault/secrets/elasticsearch
              echo "→ Attente de la base de données..."
              until php bin/console doctrine:query:sql "SELECT 1" > /dev/null 2>&1; do sleep 2; done
              echo "→ Exécution des migrations..."
              php bin/console doctrine:migrations:migrate --no-interaction
              echo "→ Migrations terminées. Démarrage du serveur..."
              {{- if eq .Values.server.type "builtin" }}
              exec php -S 0.0.0.0:9001 -t public
              {{- else }}
              exec /usr/local/bin/entrypoint-prod.sh php-fpm
              {{- end }}
          {{- else }}
          args: [". /vault/secrets/config && . /vault/secrets/minio && . /vault/secrets/elasticsearch && exec /usr/local/bin/entrypoint-prod.sh php-fpm"]
          {{- end }}
          ports:
            - containerPort: 9000
          env:
            - name: APP_ENV
              value: {{ .Values.env.APP_ENV | quote }}
            - name: CORS_ALLOW_ORIGIN
              value: {{ .Values.env.CORS_ALLOW_ORIGIN | quote }}
            - name: RESET_PASSWORD_URL
              value: {{ .Values.env.RESET_PASSWORD_URL | quote }}
            - name: MESSAGERIE_URL
              value: {{ .Values.env.MESSAGERIE_URL | quote }}
            {{- if .Values.env.INTERNAL_SECRET }}
            - name: INTERNAL_SECRET
              value: {{ .Values.env.INTERNAL_SECRET | quote }}
            {{- end }}
            - name: MINIO_ENDPOINT
              value: {{ .Values.env.MINIO_ENDPOINT | quote }}
            - name: MINIO_ACCESS_KEY
              value: {{ .Values.env.MINIO_ACCESS_KEY | quote }}
            - name: MINIO_BUCKET
              value: {{ .Values.env.MINIO_BUCKET | quote }}
            - name: MINIO_PUBLIC_URL
              value: {{ .Values.env.MINIO_PUBLIC_URL | quote }}
            - name: ELASTICSEARCH_HOST
              value: {{ .Values.env.ELASTICSEARCH_HOST | quote }}
            - name: ELASTICSEARCH_USERNAME
              value: {{ .Values.env.ELASTICSEARCH_USERNAME | quote }}

          # Montage des clés pour PHP
          volumeMounts:
            - name: jwt-keys
              mountPath: /var/www/backend/config/jwt
              readOnly: true

        # --- Conteneur Nginx (image non-root, uid 101) ---
        - name: nginx
          image: nginxinc/nginx-unprivileged:stable-alpine
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8090
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf

      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "woc-backend.fullname" . }}-nginx-config
            items:
              - key: nginx.conf
                path: nginx.conf
        
        - name: jwt-keys
          secret:
            secretName: jwt-keys