apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "woc-backend.fullname" . }}-fetch-tech-news
  labels:
    app: {{ include "woc-backend.name" . }}-cron
spec:
  schedule: "0 */3 * * *"
  
  concurrencyPolicy: Forbid 
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  
  jobTemplate:
    spec:
      template:
        spec:
          imagePullSecrets:
          - name: {{ .Values.registry.imagePullSecretName }}
          
          containers:
            - name: php-cron
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              
              workingDir: /var/www/backend
              
              command: ["php", "bin/console", "app:fetch-tech-news"]
              
              env:
                - name: APP_ENV
                  value: {{ .Values.env.APP_ENV | quote }}
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: woc-db
                      key: DATABASE_URL
              
              volumeMounts:
                - name: jwt-keys
                  mountPath: /var/www/backend/config/jwt
                  readOnly: true
                  
          restartPolicy: OnFailure
          
          volumes:
            - name: jwt-keys
              secret:
                secretName: jwt-keys