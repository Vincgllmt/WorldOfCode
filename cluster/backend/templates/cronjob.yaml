apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "woc-backend.fullname" . }}-fetch-tech-news
  labels:
    app: {{ include "woc-backend.name" . }}-cron
spec:
  schedule: "0 */3 * * *"
  
  concurrencyPolicy: Forbid 
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/agent-pre-populate-only: "true"
            vault.hashicorp.com/role: "app"
            vault.hashicorp.com/agent-inject-secret-config: "{{ .Values.vault.secretPath }}"
            vault.hashicorp.com/agent-inject-template-config: |
              {{ print "{{- with secret \"" .Values.vault.secretPath "\" -}}" }}
              export DATABASE_URL={{ "\"{{ .Data.data.url }}\"" }}
              {{ "{{- end -}}" }}
        spec:
          imagePullSecrets:
          - name: {{ .Values.registry.imagePullSecretName }}
          
          containers:
            - name: php-cron
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              
              workingDir: /var/www/backend
              
              command: ["/bin/sh", "-c"]
              args: [". /vault/secrets/config && exec php bin/console app:fetch-tech-news"]
              
              env:
                - name: APP_ENV
                  value: {{ .Values.env.APP_ENV | quote }}
              
              volumeMounts:
                - name: jwt-keys
                  mountPath: /var/www/backend/config/jwt
                  readOnly: true
                  
          restartPolicy: OnFailure
          
          volumes:
            - name: jwt-keys
              secret:
                secretName: jwt-keys