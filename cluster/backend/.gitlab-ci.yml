build:backend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  before_script: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "production"'
      changes:
        - backend/**/*
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true
  script:
    - echo "Configuration de l'authentification Kaniko..."
    - |
      echo "{\"auths\":{\"${REGISTRY_HOST}\":{\"auth\":\"$(printf "%s:%s" "${REGISTRY_USER}" "${REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json

    - echo "Build et Push vers ${REGISTRY_HOST}/backend:${CI_COMMIT_SHORT_SHA}"
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/backend" \
        --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile.prod" \
        --destination "${REGISTRY_HOST}/backend:${CI_COMMIT_SHORT_SHA}" \
        --insecure \
        --skip-tls-verify \
        --cache=true

scan:backend:
  extends: .trivy_scan_template
  variables:
    APP_NAME: "backend"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "production"'
      changes:
        - backend/**/*

    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "production"'
      when: manual
      allow_failure: true

# 2. Déploiement automatique en DEV
deploy:backend:dev:
  stage: deploy-apps
  extends: .deploy_helm_template
  environment:
    name: dev
  variables:
    APP_NAMESPACE: "dev"
    RELEASE_NAME: "backend"
    CHART_PATH: "cluster/backend"
    IMAGE_PULL_SECRET: "woc-regcred"
    VALUES_FILE: "cluster/backend/values-dev.yaml"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - backend/**/*
      when: on_success

    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true

# 3. Déploiement manuel en PRODUCTION
deploy:backend:prod:
  stage: deploy-apps
  extends: .deploy_helm_template
  environment:
    name: production
  variables:
    APP_NAMESPACE: "production"
    RELEASE_NAME: "backend"
    CHART_PATH: "cluster/backend"
    IMAGE_PULL_SECRET: "woc-regcred"
    VALUES_FILE: "cluster/backend/values-prod.yaml"
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
      changes:
        - backend/**/*
      when: manual

    - if: '$CI_COMMIT_BRANCH == "production"'
      when: manual
      allow_failure: true

# 4. Job de Seed de la BDD
seed:backend:dev:
  stage: deploy-apps
  image: alpine/k8s:1.31.13
  environment:
    name: dev
  script:
    - echo "Attente que le pod backend soit prêt..."
    - kubectl rollout status deployment/backend -n dev --timeout=120s || true
    - echo "Exécution des commandes Doctrine dans le pod backend..."
    - "POD_NAME=$(kubectl get pods -n dev -l app=backend -o jsonpath='{.items..metadata.name}' | awk '{print $1}')"
    - 'if [ -z "$POD_NAME" ]; then echo "❌ Erreur - Aucun pod backend trouvé avec le label app=backend" && exit 1; fi'
    - kubectl exec -n dev $POD_NAME -- php bin/console doctrine:database:drop --force || true
    - kubectl exec -n dev $POD_NAME -- php bin/console doctrine:database:create
    - kubectl exec -n dev $POD_NAME -- php bin/console doctrine:migrations:migrate -n
    - 'echo "Lancement du job de seed: cluster/backend/seed-job.yaml"'
    - kubectl delete -f cluster/backend/seed-job.yaml -n dev --ignore-not-found || true
    - kubectl apply -f cluster/backend/seed-job.yaml -n dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true
