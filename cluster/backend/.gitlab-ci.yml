build:backend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  before_script: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "production"'
      changes:
        - backend/**/*
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true
  script:
    - echo "Configuration de l'authentification Kaniko..."
    - AUTH=$(printf "%s:%s" "${REGISTRY_USER}" "${REGISTRY_PASSWORD}" | base64 | tr -d '\n')
    - 'echo "{\"auths\":{\"${REGISTRY_HOST}\":{\"auth\":\"${AUTH}\"}}}" > /kaniko/.docker/config.json'
    - 'echo "Build et Push Production Image: ${REGISTRY_HOST}/backend:${CI_COMMIT_SHORT_SHA}"'
    - /kaniko/executor --context "${CI_PROJECT_DIR}/backend" --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile.prod" --destination "${REGISTRY_HOST}/backend:${CI_COMMIT_SHORT_SHA}" --insecure --skip-tls-verify --cache=true
    - 'echo "Build et Push Seed (Faker) Image: ${REGISTRY_HOST}/backend:${CI_COMMIT_SHORT_SHA}-faker"'
    - /kaniko/executor --context "${CI_PROJECT_DIR}/backend" --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile.faker" --destination "${REGISTRY_HOST}/backend:${CI_COMMIT_SHORT_SHA}-faker" --insecure --skip-tls-verify --cache=true

deploy:backend:dev:
  stage: deploy-apps
  extends: .deploy_helm_template
  environment:
    name: dev
  variables:
    APP_NAMESPACE: "dev"
    RELEASE_NAME: "backend"
    CHART_PATH: "cluster/backend"
    IMAGE_PULL_SECRET: "woc-regcred"
    VALUES_FILE: "cluster/backend/values-dev.yaml"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - backend/**/*
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true

deploy:backend:prod:
  stage: deploy-apps
  extends: .deploy_helm_template
  environment:
    name: production
  variables:
    APP_NAMESPACE: "production"
    RELEASE_NAME: "backend"
    CHART_PATH: "cluster/backend"
    IMAGE_PULL_SECRET: "woc-regcred"
    VALUES_FILE: "cluster/backend/values-prod.yaml"
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
      changes:
        - backend/**/*
      when: manual
    - if: '$CI_COMMIT_BRANCH == "production"'
      when: manual
      allow_failure: true

seed:backend:dev:
  stage: deploy-apps
  image: alpine/k8s:1.31.13
  environment:
    name: dev
  script:
    - echo "Attente que le pod backend soit prêt..."
    - kubectl rollout status deployment/backend -n dev --timeout=120s || true
    - echo "Exécution des commandes Doctrine dans le pod backend..."
    - POD_NAME=$(kubectl get pods -n dev -l app=backend -o jsonpath='{.items[0].metadata.name}')
    - if [ -z "$POD_NAME" ]; then echo "Erreur - Aucun pod backend trouvé" && exit 1; fi
    - kubectl exec -n dev $POD_NAME -c php-fpm -- /bin/sh -c ". /vault/secrets/config && php bin/console doctrine:database:drop --force" || true
    - kubectl exec -n dev $POD_NAME -c php-fpm -- /bin/sh -c ". /vault/secrets/config && php bin/console doctrine:database:create"
    - kubectl exec -n dev $POD_NAME -c php-fpm -- /bin/sh -c ". /vault/secrets/config && php bin/console doctrine:migrations:migrate -n"
    - 'echo "Lancement du job de seed: cluster/backend/seed-job.yaml"'
    - 'sed -i "s|image:.*|image: registry.woc:32000/backend:${CI_COMMIT_SHORT_SHA}-faker|g" cluster/backend/seed-job.yaml'
    - kubectl delete -f cluster/backend/seed-job.yaml -n dev --ignore-not-found || true
    - kubectl apply -f cluster/backend/seed-job.yaml -n dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true