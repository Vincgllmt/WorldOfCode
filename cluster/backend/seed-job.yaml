apiVersion: batch/v1
kind: Job
metadata:
  name: seed-backend
  namespace: dev
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: "app"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/backend"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/backend" -}}
          export DATABASE_URL="{{ .Data.data.url }}"
          {{- end -}}
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      restartPolicy: Never
      imagePullSecrets:
        - name: woc-regcred
      containers:
        - name: seed
          image: registry.woc:32000/backend:faker
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args: [". /vault/secrets/config && php -d memory_limit=512M bin/console doctrine:fixtures:load --no-interaction --env=dev"]
          env:
            - name: APP_ENV
              value: "dev"
