apiVersion: batch/v1
kind: Job
metadata:
  name: seed-backend
  namespace: preprod
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: woc-regcred
      containers:
        - name: seed
          image: registry.woc:32000/woc-backend:faker
          command: ["php", "bin/console", "doctrine:fixtures:load", "--no-interaction", "--env=dev"]
          env:
            - name: APP_ENV
              value: "dev"
            - name: DATABASE_URL
              value: "mysql://application:password@mysql:3306/projet_web"