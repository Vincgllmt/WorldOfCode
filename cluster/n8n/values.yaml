ingress:
  enabled: false
  # annotations:
  #   traefik.ingress.kubernetes.io/router.entrypoints: web
  # className: "traefik"
  # hosts:
  #   - host: n8n.local
  #     paths:
  #       - path: /
  #         pathType: Prefix
  # tls: []

main:
  config:
    db:
      type: sqlite
      sqlite:
        pool_size: 4

    n8n:
      host: localhost
      protocol: http
      port: 5678
      editor_base_url: "http://localhost:5678"
      webhook_url: "http://localhost:5678"
      runners_enabled: true
      block_env_access_in_node: true
      git_node_disable_bare_repos: true
      secure_cookie: false

  persistence:
    enabled: true
    type: dynamic
    storageClass: "longhorn-one-replica"
    accessModes:
      - ReadWriteOnce
    size: 5Gi