image: alpine/k8s:1.31.13

before_script:
  - set -e
  - mkdir -p ~/.kube
  - printf "%s" "$KUBECONFIG" | base64 -d > /tmp/decoded_kubeconfig
  - export KUBECONFIG=/tmp/decoded_kubeconfig
  - kubectl cluster-info

deploy:ollama:
  stage: deploy-n8n-ollama
  when: manual
  variables:
    OLLAMA_NAMESPACE: "n8n"
    OLLAMA_RELEASE: "ollama"
  script:
    - kubectl create namespace "$OLLAMA_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
    - helm repo add ollama-helm https://otwld.github.io/ollama-helm/
    - helm repo update
    - |
      helm upgrade --install "$OLLAMA_RELEASE" ollama-helm/ollama \
        --namespace "$OLLAMA_NAMESPACE" \
        --values cluster/n8n/ollama-values.yaml

deploy:n8n:
  stage: deploy-n8n-ollama
  when: manual
  variables:
    N8N_NAMESPACE: "n8n"
    N8N_RELEASE_NAME: "n8n"
    N8N_CHART: "oci://8gears.container-registry.com/library/n8n"
    N8N_CHART_VERSION: "2.0.1"
  script:
    - kubectl create namespace "$N8N_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
    - ls -alrt
    - echo "Déploiement de n8n..."
    - |
      helm upgrade --install "$N8N_RELEASE_NAME" "$N8N_CHART" \
        --namespace "$N8N_NAMESPACE" \
        --version "$N8N_CHART_VERSION" \
        --values cluster/n8n/values.yaml