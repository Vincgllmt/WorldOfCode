# ollama-values.yaml

ollama:
  # L'erreur indiquait que "models" est une map avec des clés spécifiques
  models:
    pull:
      - llama3.2
    # Optionnel: définir "run" force ce modèle au démarrage, mais "pull" suffit pour qu'il soit dispo
    run: []

  # Désactivation du GPU pour tes VPS OVH
  gpu:
    enabled: false

# Configuration des ressources (Identique à avant, adapté pour 8Go RAM)
resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "6Gi"

# Persistance Longhorn
persistentVolume:
  enabled: true
  size: 10Gi
  storageClass: "longhorn-one-replica"
  accessModes:
    - ReadWriteOnce

# Service interne pour n8n
service:
  type: ClusterIP
  port: 11434
  enabled: true

# Node Selector (Si tu veux toujours isoler l'IA, décommente ci-dessous)
nodeSelector:
  role: "ai-worker"