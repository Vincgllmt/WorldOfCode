deploy:uptime-kuma:
  stage: deploy-monitoring
  needs: []
  variables:
    UPTIME_KUMA_NAMESPACE: "monitoring"
    UPTIME_KUMA_RELEASE: "uptime-kuma"
  when: manual
  # Job ops à la demande : ne doit pas bloquer les pipelines (feature/MR) en restant "manual".
  allow_failure: true
  script:
    - kubectl create namespace "$UPTIME_KUMA_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
    - helm repo add uptime-kuma https://dirsigler.github.io/uptime-kuma-helm
    - helm repo add bitnami https://charts.bitnami.com/bitnami
    - helm repo update
    - echo "Mise à jour des dépendances Helm..."
    - helm dependency update cluster/uptime-kuma
    - echo "Déploiement d'Uptime-Kuma avec MariaDB..."
    - |
      helm upgrade --install "$UPTIME_KUMA_RELEASE" cluster/uptime-kuma \
        --namespace "$UPTIME_KUMA_NAMESPACE" \
        --values cluster/uptime-kuma/values.yaml
