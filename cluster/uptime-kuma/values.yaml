uptime-kuma:
  ingress:
    enabled: true
    className: "traefik"
    hosts:
      - host: kuma.woc
        paths:
          - path: /
            pathType: Prefix

  volume:
    enabled: true
    accessMode: ReadWriteOnce
    size: 3Gi
    storageClassName: "longhorn-dev"

  mariadb:
    enabled: true
    global:
      defaultStorageClass: "longhorn-dev"
    fullnameOverride: uptime-kuma-mariadb
    auth:
      database: uptime_kuma
      username: kuma
      password: kuma
    primary:
      persistence:
        enabled: true
        size: 3Gi
        storageClass: "longhorn-dev"