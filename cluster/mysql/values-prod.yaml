global:
  security:
    allowInsecureImages: true

image:
  repository: bitnamilegacy/mysql
  tag: 9.4.0-debian-12-r1

fullnameOverride: mysql

architecture: standalone

auth:
  rootPassword: changeme
  database: projet_web
  username: application
  password: password

primary:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: longhorn-mysql
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
