global:
  security:
    allowInsecureImages: true

serviceAccount:
  create: true
  automountServiceAccountToken: true

image:
  repository: bitnamilegacy/mysql
  tag: 9.4.0-debian-12-r1

fullnameOverride: mysql

architecture: standalone

auth:
  database: projet_web
  username: application

primary:
  automountServiceAccountToken: true
  podAnnotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "app"
    vault.hashicorp.com/agent-init-first: "false"
    vault.hashicorp.com/agent-inject-secret-mysql-root: "secret/data/production/mysql"
    vault.hashicorp.com/agent-inject-template-mysql-root: |
      {{ "{{- with secret \"secret/data/production/mysql\" -}}" }}
      {{ "{{ .Data.data.rootPassword }}" }}
      {{ "{{- end -}}" }}
    vault.hashicorp.com/agent-inject-secret-mysql-user: "secret/data/production/mysql"
    vault.hashicorp.com/agent-inject-template-mysql-user: |
      {{ "{{- with secret \"secret/data/production/mysql\" -}}" }}
      {{ "{{ .Data.data.password }}" }}
      {{ "{{- end -}}" }}
  initContainers:
    - name: wait-for-vault
      image: curlimages/curl:8.13.0
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Attente de Vault unsealed..."
          until curl -s http://vault.vault.svc:8200/v1/sys/health | grep -q '"sealed":false'; do
            echo "Vault est scellé, nouvelle tentative dans 5s..."
            sleep 5
          done
          echo "Vault prêt."
  extraEnvVars:
    - name: MYSQL_ROOT_PASSWORD_FILE
      value: "/vault/secrets/mysql-root"
    - name: MYSQL_PASSWORD_FILE
      value: "/vault/secrets/mysql-user"
  persistence:
    enabled: true
    size: 10Gi
    storageClass: local-path-retain
  configuration: |-
    [mysqld]
    max_connections=300
    skip-name-resolve
    explicit_defaults_for_timestamp
    basedir=/opt/bitnami/mysql
    plugin_dir=/opt/bitnami/mysql/lib/plugin
    port=3306
    socket=/opt/bitnami/mysql/tmp/mysql.sock
    datadir=/bitnami/mysql/data
    tmpdir=/opt/bitnami/mysql/tmp
    max_allowed_packet=16M
    bind-address=*
    pid-file=/opt/bitnami/mysql/tmp/mysqld.pid
    log-error=/opt/bitnami/mysql/logs/mysqld.log
    character-set-server=UTF8
    slow_query_log=0
    long_query_time=10.0
    [client]
    port=3306
    socket=/opt/bitnami/mysql/tmp/mysql.sock
    default-character-set=UTF8
    plugin_dir=/opt/bitnami/mysql/lib/plugin
    [manager]
    port=3306
    socket=/opt/bitnami/mysql/tmp/mysql.sock
    pid-file=/opt/bitnami/mysql/tmp/mysqld.pid
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
