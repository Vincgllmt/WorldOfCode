deploy:mysql:dev:
  stage: deploy-services
  needs: []
  environment:
    name: dev
  variables:
    APP_NAMESPACE: "dev"
    RELEASE_NAME: "mysql"
    MYSQL_CHART: "bitnami/mysql"
    MYSQL_CHART_VERSION: "12.2.2"
    VALUES_FILE: "cluster/mysql/values-dev.yaml"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true
  script:
    - kubectl create namespace "$APP_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
    - kubectl apply -f cluster/mysql/templates/storageclass.yaml
    - kubectl apply -n "$APP_NAMESPACE" -f cluster/mysql/templates/cronjob-backups.yaml
    - helm repo add bitnami https://charts.bitnami.com/bitnami
    - helm repo update
    - echo "Déploiement de MySQL sur la DEV"
    - |
      EXISTING_ROOT_PWD=$(kubectl get secret --namespace "$APP_NAMESPACE" "$RELEASE_NAME" -o jsonpath="{.data.mysql-root-password}" 2>/dev/null | base64 -d || echo "vault-managed-root")
      EXISTING_APP_PWD=$(kubectl get secret --namespace "$APP_NAMESPACE" "$RELEASE_NAME" -o jsonpath="{.data.mysql-password}" 2>/dev/null | base64 -d || echo "vault-managed-user")
      helm upgrade --install "$RELEASE_NAME" "$MYSQL_CHART" \
        --namespace "$APP_NAMESPACE" \
        --version "$MYSQL_CHART_VERSION" \
        --values "$VALUES_FILE" \
        --set auth.rootPassword="$EXISTING_ROOT_PWD" \
        --set auth.password="$EXISTING_APP_PWD"

deploy:mysql:prod:
  stage: deploy-services
  needs: []
  environment:
    name: production
  variables:
    APP_NAMESPACE: "production"
    RELEASE_NAME: "mysql"
    MYSQL_CHART: "bitnami/mysql"
    MYSQL_CHART_VERSION: "12.2.2"
    VALUES_FILE: "cluster/mysql/values-prod.yaml"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - kubectl create namespace "$APP_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
    - kubectl apply -f cluster/mysql/templates/storageclass.yaml
    - kubectl apply -n "$APP_NAMESPACE" -f cluster/mysql/templates/cronjob-backups.yaml
    - helm repo add bitnami https://charts.bitnami.com/bitnami
    - helm repo update
    - echo "Déploiement de MySQL sur la PRODUCTION"
    - |
      EXISTING_ROOT_PWD=$(kubectl get secret --namespace "$APP_NAMESPACE" "$RELEASE_NAME" -o jsonpath="{.data.mysql-root-password}" 2>/dev/null | base64 -d || echo "vault-managed-root")
      EXISTING_APP_PWD=$(kubectl get secret --namespace "$APP_NAMESPACE" "$RELEASE_NAME" -o jsonpath="{.data.mysql-password}" 2>/dev/null | base64 -d || echo "vault-managed-user")
      helm upgrade --install "$RELEASE_NAME" "$MYSQL_CHART" \
        --namespace "$APP_NAMESPACE" \
        --version "$MYSQL_CHART_VERSION" \
        --values "$VALUES_FILE" \
        --set auth.rootPassword="$EXISTING_ROOT_PWD" \
        --set auth.password="$EXISTING_APP_PWD"

