global:
  security:
    allowInsecureImages: true

serviceAccount:
  create: true
  automountServiceAccountToken: true

image:
  repository: bitnamilegacy/mysql
  tag: 9.4.0-debian-12-r1

fullnameOverride: mysql

architecture: standalone

auth:
  database: projet_web
  username: application

primary:
  automountServiceAccountToken: true
  podAnnotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "app"
    vault.hashicorp.com/agent-inject-secret-mysql-root: "secret/data/mysql"
    vault.hashicorp.com/agent-inject-template-mysql-root: |
      {{ "{{- with secret \"secret/data/mysql\" -}}" }}
      {{ "{{ .Data.data.rootPassword }}" }}
      {{ "{{- end -}}" }}
    vault.hashicorp.com/agent-inject-secret-mysql-user: "secret/data/mysql"
    vault.hashicorp.com/agent-inject-template-mysql-user: |
      {{ "{{- with secret \"secret/data/mysql\" -}}" }}
      {{ "{{ .Data.data.password }}" }}
      {{ "{{- end -}}" }}
  extraEnvVars:
    - name: MYSQL_ROOT_PASSWORD_FILE
      value: "/vault/secrets/mysql-root"
    - name: MYSQL_PASSWORD_FILE
      value: "/vault/secrets/mysql-user"
  persistence:
    enabled: true
    size: 5Gi
    storageClass: longhorn-mysql
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
