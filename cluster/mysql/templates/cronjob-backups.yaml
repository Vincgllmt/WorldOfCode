apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-local-backup
  namespace: dev
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:

          nodeSelector:
            kubernetes.io/hostname: "kube-worker-01"

          containers:
            - name: mysqldump
              image: bitnamilegacy/mysql:9.4.0-debian-12-r1
              
              securityContext:
                runAsUser: 0 
                
              env:
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: woc-messagerie-db
                      key: DB_HOST
                - name: DB_PORT
                  valueFrom:
                    secretKeyRef:
                      name: woc-messagerie-db
                      key: DB_PORT
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: woc-messagerie-db
                      key: DB_USER
                - name: DB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: woc-messagerie-db
                      key: DB_PASS
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: woc-messagerie-db
                      key: DB_NAME

              command:
                - /bin/sh
                - -c
                - |
                  echo "Démarrage de la sauvegarde MySQL..."
                  DATE=$(date +\%Y-\%m-\%d_\%H-\%M-\%S)
                  FILE="/backups/woc_mysql_backup_${DATE}.sql"
                  
                  # Ajout d'un timeout de 10s pour ne pas bloquer dans le vide si le réseau bug
                  mysqldump --no-tablespaces -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" -p"$DB_PASS" "$DB_NAME" > "$FILE"
                  
                  # On vérifie si le dump a réussi avant de compresser
                  if [ $? -eq 0 ]; then
                    echo "Dump terminé, compression en cours..."
                    gzip "$FILE"
                    echo "Sauvegarde réussie : $FILE.gz"
                  else
                    echo "Échec de la sauvegarde (Vérifiez les identifiants ou la connexion) !"
                    rm -f "$FILE"
                    exit 1
                  fi
                  
                  find /backups -type f -name "${DB_NAME}_*.sql.gz" -mtime +7 -exec rm {} \;
              
              volumeMounts:
                - name: host-backup-dir
                  mountPath: /backups
          
          restartPolicy: OnFailure
          
          volumes:
            - name: host-backup-dir
              hostPath:
                path: /var/opt/mysql-backups
                type: DirectoryOrCreate