apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-local-backup
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/agent-pre-populate-only: "true"
            vault.hashicorp.com/role: "app"
            vault.hashicorp.com/agent-inject-secret-mysql: "secret/data/mysql"
            vault.hashicorp.com/agent-inject-template-mysql: |
              {{- with secret "secret/data/mysql" -}}
              export DB_PASS="{{ .Data.data.rootPassword }}"
              export DB_HOST="{{ .Data.data.host }}"
              {{- end -}}
        spec:
          nodeSelector:
            kubernetes.io/hostname: "kube-worker-01"

          containers:
            - name: mysqldump
              image: bitnamilegacy/mysql:9.4.0-debian-12-r1
              
              securityContext:
                runAsUser: 0 
                
              env:
                - name: DB_PORT
                  value: "3306"
                - name: DB_USER
                  value: "root"
                - name: DB_NAME
                  value: "projet_web"

              command:
                - /bin/sh
                - -c
                - |
                  # Source des secrets Vault si le fichier existe
                  if [ -f /vault/secrets/mysql ]; then
                    . /vault/secrets/mysql
                  fi

                  echo "Démarrage de la sauvegarde MySQL..."
                  DATE=$(date +%Y-%m-%d_%H-%M-%S)
                  FILE="/backups/woc_mysql_backup_${DATE}.sql"
                  
                  # Ajout d'un timeout de 10s pour ne pas bloquer dans le vide si le réseau bug
                  mysqldump --no-tablespaces -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" -p"$DB_PASS" "$DB_NAME" > "$FILE"
                  
                  # On vérifie si le dump a réussi avant de compresser
                  if [ $? -eq 0 ]; then
                    echo "Dump terminé, compression en cours..."
                    gzip "$FILE"
                    echo "Sauvegarde réussie : $FILE.gz"
                  else
                    echo "Échec de la sauvegarde (Vérifiez les identifiants ou la connexion) !"
                    rm -f "$FILE"
                    exit 1
                  fi
                  
                  find /backups -type f -name "woc_mysql_backup_*.sql.gz" -mtime +7 -exec rm {} \;
              
              volumeMounts:
                - name: host-backup-dir
                  mountPath: /backups
          
          restartPolicy: OnFailure
          
          volumes:
            - name: host-backup-dir
              hostPath:
                path: /var/opt/mysql-backups
                type: DirectoryOrCreate