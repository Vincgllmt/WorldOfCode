---
# JOIN WORKERS

- name: Read join token from controller
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  delegate_to: "{{ groups['k8s_controllers'][0] }}"
  register: controller_token

- name: Set join token fact
  ansible.builtin.set_fact:
    k3s_token: "{{ controller_token.content | b64decode | trim }}"

- name: Install K3s agent
  ansible.builtin.shell: "curl -sfL https://get.k3s.io | sh -"
  environment:
    K3S_URL: "https://{{ hostvars[groups['k8s_controllers'][0]].ansible_host }}:6443"
    K3S_TOKEN: "{{ k3s_token }}"
  become: true


