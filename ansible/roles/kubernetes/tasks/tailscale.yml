---
- name: Install Tailscale signing key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/bookworm.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'
  when: ansible_distribution == 'Debian'

- name: Add Tailscale repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian bookworm main"
    state: present
    filename: tailscale
  when: ansible_distribution == 'Debian'

- name: Install Tailscale signing key (Ubuntu)
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/ubuntu/jammy.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'
  when: ansible_distribution == 'Ubuntu'

- name: Add Tailscale repository (Ubuntu)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu {{ ansible_distribution_release }} main"
    state: present
    filename: tailscale
  when: ansible_distribution == 'Ubuntu'

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Start Tailscale and authenticate
  ansible.builtin.command:
    cmd: "tailscale up --authkey={{ tailscale_auth_key }} --hostname={{ inventory_hostname }} --accept-dns=false"
  become: true
  changed_when: false

- name: Get Tailscale IP
  ansible.builtin.command: "tailscale ip -4"
  register: tailscale_ip_cmd
  changed_when: false

- name: Set Tailscale IP fact
  ansible.builtin.set_fact:
    tailscale_ip: "{{ tailscale_ip_cmd.stdout | trim }}"
