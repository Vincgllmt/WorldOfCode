---
# tasks file for roles/kubernetes

- name: Create the 'ubuntu' user
  ansible.builtin.import_tasks:
    file: create_user_ubuntu.yml
  tags: [create-user]

- name: Cluster prep
  ansible.builtin.import_tasks:
    file: prereq.yml
  tags: [prereq]

- name: Setup Tailscale Mesh VPN
  ansible.builtin.import_tasks:
    file: tailscale.yml
  tags: [tailscale]

- name: Init cluster
  ansible.builtin.import_tasks:
    file: init.yml
  when: kube_master == ansible_hostname and ansible_hostname in groups[kube_controller_group]
  tags: [init]

- name: Gather facts from all hosts
  ansible.builtin.setup:
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ ansible_play_hosts_all }}"

- name: Join workers
  ansible.builtin.import_tasks:
    file: join.yml
  when: ansible_hostname in groups[kube_worker_group]
  tags: [join]