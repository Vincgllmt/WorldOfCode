---

- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Configure cluster hosts in /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    state: present
    marker: "# {mark} ANSIBLE MANAGED BLOCK - K3S INFRASTRUCTURE"
    block: |
      {% for host in groups['kubernetes'] %}
      {% if hostvars[host].ansible_host is defined %}
      {{ hostvars[host].ansible_host }} {{ host }}
      {% endif %}
      {% endfor %}

- name: Update cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install dependencies
  ansible.builtin.apt:
    name: "{{ dependencies_packages }}"
    state: present
    install_recommends: false

- name: Ensure iscsid is started and enabled
  ansible.builtin.service:
    name: iscsid
    state: started
    enabled: true

- name: Create K3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'

- name: Deploy Flannel network configuration
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/flannel.json
    owner: root
    group: root
    mode: '0644'
    content: |
      {
        "Network": "10.42.0.0/16",
        "SubnetLen": 24,
        "Backend": {
          "Type": "vxlan",
          "MTU": 1200
        }
      }

