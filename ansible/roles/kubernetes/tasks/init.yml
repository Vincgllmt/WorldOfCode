---
# MASTEER
- name: Deploy K3s server configuration
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: '0644'
    content: |
      node-ip: "{{ tailscale_ip }}"
      node-external-ip: "{{ tailscale_ip }}"
      bind-address: "0.0.0.0"
      flannel-iface: "tailscale0"
      flannel-conf: "/etc/rancher/k3s/flannel.json"
      tls-san:
        - "{{ ansible_host }}"
        - "{{ tailscale_ip }}"
  register: k3s_server_config

- name: Install K3s server
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | sh -
  environment:
    INSTALL_K3S_SKIP_ENABLE: "true"
  changed_when: false

- name: Restart K3s server
  ansible.builtin.systemd:
    name: k3s
    state: restarted
    daemon_reload: true
    enabled: true
  when: k3s_server_config.changed or flannel_config.changed

- name: Wait for server ready
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    timeout: 60

- name: Read server join token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: token_file

- name: Set join token fact
  ansible.builtin.set_fact:
    k3s_token: "{{ token_file['content'] | b64decode | trim }}"
    cacheable: yes # accès var pour les workers

- name: S'assurer que le dossier .kube existe
  file:
    path: /root/.kube
    state: directory
    mode: '0700'

- name: Read internal K3s kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: internal_kubeconfig

- name: Deploy tailored kubeconfig for root
  copy:
    dest: /root/.kube/config
    content: "{{ internal_kubeconfig['content'] | b64decode | replace('127.0.0.1', ansible_host) }}"
    owner: root
    group: root
    mode: '0600'
  when: ansible_host is defined

- name: Vérifier l’accès au cluster
  command: kubectl get nodes
  register: kubectl_check
  ignore_errors: true
  changed_when: false

- name: Afficher le résultat
  debug:
    var: kubectl_check.stdout