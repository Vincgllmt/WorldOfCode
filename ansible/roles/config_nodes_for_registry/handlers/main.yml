---
# handlers file for config_nodes_for_registry
- name: Redémarrer containerd
  systemd:
    name: containerd
    state: restarted
  become: true

- name: Redémarrer k3s
  systemd:
    name: k3s
    state: restarted
  become: true
  ignore_errors: true

- name: Redémarrer k3s-agent
  systemd:
    name: k3s-agent
    state: restarted
  become: true
  ignore_errors: true
