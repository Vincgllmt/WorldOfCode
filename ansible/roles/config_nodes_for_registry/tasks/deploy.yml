---
# tasks file for config_nodes_for_registry

- name: Préparer un environnement virtuel local avec la librairie kubernetes
  pip:
    name: kubernetes
    virtualenv: /tmp/ansible-k8s-venv
    virtualenv_command: python3 -m venv
  delegate_to: localhost
  connection: local
  run_once: true
  become: false
  vars:
    ansible_become: false

- name: Appliquer la configuration de CoreDNS pour ajouter registry.woc
  k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: coredns
        namespace: kube-system
      data:
        Corefile: |
          .:53 {
              errors
              health {
                 lameduck 5s
              }
              ready
              kubernetes cluster.local in-addr.arpa ip6.arpa {
                 pods insecure
                 fallthrough in-addr.arpa ip6.arpa
                 ttl 30
              }
              prometheus :9153
              hosts {
                  192.168.121.110 registry.woc.svc.cluster.local
                  fallthrough
              }
              forward . 8.8.8.8 1.1.1.1 {
                 max_concurrent 1000
              }
              cache 30 {
                 disable success cluster.local
                 disable denial cluster.local
              }
              loop
              reload
              loadbalance
          }
  delegate_to: localhost
  connection: local
  run_once: true
  become: false
  vars:
    ansible_become: false
    ansible_python_interpreter: /tmp/ansible-k8s-venv/bin/python

- name: Ajouter registry.woc au fichier /etc/hosts
  lineinfile:
    path: /etc/hosts
    line: "{{ registry_ip }} registry.woc"
    regexp: '^.*registry\.woc$'
    state: present
  become: true

# --- NOUVELLE TÂCHE : Création du dossier ---
- name: S'assurer que le répertoire /etc/containerd existe sur les nœuds
  file:
    path: /etc/containerd
    state: directory
    mode: '0755'
  become: true

- name: Copier le fichier config.toml sur chaque nœud
  copy:
    src: config.toml
    dest: /etc/containerd/config.toml
    mode: '0644'
  become: true

- name: S'assurer que le répertoire /etc/rancher/k3s existe sur les nœuds
  file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'
  become: true

- name: Copier le fichier registries.yaml pour k3s
  template:
    src: registries.yaml.j2
    dest: /etc/rancher/k3s/registries.yaml
    mode: '0644'
  become: true
  notify:
    - Redémarrer k3s
    - Redémarrer k3s-agent