<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <!-- Halos lumineux flous qui dérivent -->
    <radialGradient id="blob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <!-- Bande de lumière qui balaye en diagonale -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6" /></filter>

    <style><![CDATA[
      .blob   { mix-blend-mode: screen; }
      .b1 { animation: drift1 14s ease-in-out infinite; }
      .b2 { animation: drift2 18s ease-in-out infinite; }
      .b3 { animation: drift3 22s ease-in-out infinite; }
      @keyframes drift1 { 0%,100% { transform: translate(0,0)     scale(1);   } 50% { transform: translate(80px,30px)  scale(1.15); } }
      @keyframes drift2 { 0%,100% { transform: translate(0,0)     scale(1.1); } 50% { transform: translate(-70px,-25px) scale(0.9);  } }
      @keyframes drift3 { 0%,100% { transform: translate(0,0)     scale(0.95);} 50% { transform: translate(40px,-40px)  scale(1.2);  } }

      /* Particules qui montent et scintillent */
      .p { fill: #ffffff; animation: rise 9s linear infinite; }
      @keyframes rise {
        0%   { transform: translateY(60px);  opacity: 0;   }
        15%  { opacity: 0.9; }
        85%  { opacity: 0.9; }
        100% { transform: translateY(-440px); opacity: 0;  }
      }
      .p2 { animation-duration: 12s; animation-delay: -3s; }
      .p3 { animation-duration: 7s;  animation-delay: -5s; }
      .p4 { animation-duration: 11s; animation-delay: -8s; }
      .p5 { animation-duration: 8s;  animation-delay: -1s; }

      .sweep { animation: sweep 8s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-1400px); } 100% { transform: translateX(1400px); } }
    ]]></style>
  </defs>

  <!-- Halos -->
  <g filter="url(#soft)">
    <circle class="blob b1" cx="250"  cy="140" r="160" fill="url(#blob)" />
    <circle class="blob b2" cx="850"  cy="260" r="200" fill="url(#blob)" />
    <circle class="blob b3" cx="1050" cy="90"  r="130" fill="url(#blob)" />
  </g>

  <!-- Particules ascendantes -->
  <g>
    <circle class="p"    cx="180"  cy="400" r="2.5" />
    <circle class="p p2" cx="420"  cy="400" r="3"   />
    <circle class="p p3" cx="640"  cy="400" r="2"   />
    <circle class="p p4" cx="900"  cy="400" r="3.5" />
    <circle class="p p5" cx="1120" cy="400" r="2.5" />
    <circle class="p p2" cx="300"  cy="400" r="2"   />
    <circle class="p p4" cx="760"  cy="400" r="2.5" />
    <circle class="p p3" cx="1020" cy="400" r="3"   />
  </g>

  <!-- Balayage de lumière -->
  <rect class="sweep" x="-200" y="-100" width="300" height="600" fill="url(#shine)" transform="skewX(-18)" />
</svg>
