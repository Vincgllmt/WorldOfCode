<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes bp-fly  { 0%,100%{transform:translateY(0) rotate(-1.2deg)} 50%{transform:translateY(-4px) rotate(1.2deg)} }
    @keyframes bp-flame{ 0%,100%{transform:scaleX(.92);opacity:.85} 50%{transform:scaleX(1.3);opacity:1} }
    @keyframes bp-blink{ 0%,90%,100%{transform:scaleY(0)} 93%,96%{transform:scaleY(1)} }
    .bp-fly  { transform-box:fill-box; transform-origin:center; animation:bp-fly 3.2s ease-in-out infinite }
    .bp-flame{ transform-box:fill-box; transform-origin:right center; animation:bp-flame .42s ease-in-out infinite }
    .bp-lid  { transform-box:fill-box; transform-origin:center; animation:bp-blink 4.6s ease-in-out infinite }
  </style>
