# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  env(LOCK_DSN): 'flock'
  env(CORS_ALLOW_ORIGIN): '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
  env(IP_HASH_SALT): 'changeme'
  env(MESSAGERIE_URL): 'http://messagerie:3000'
  env(MINIO_ENDPOINT): 'http://minio:9000'
  env(MINIO_ACCESS_KEY): 'minioadmin'
  env(MINIO_SECRET_KEY): 'minioadmin'
  env(MINIO_BUCKET): 'woc'
  env(MINIO_PUBLIC_URL): 'http://localhost:9000/woc'
  env(ELASTICSEARCH_HOST): 'http://elasticsearch:9200'
  env(ELASTICSEARCH_USERNAME): 'elastic'
  env(ELASTICSEARCH_PASSWORD): 'changeme'
  # SEC-22 : la doc OpenAPI (/doc, /doc.json) est réservée aux admins, sauf en dev (voir when@dev en bas).
  app.doc_role: ROLE_ADMIN

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: "../src/"
    exclude:
      - "../src/DependencyInjection/"
      - "../src/Entity/"
      - "../src/Kernel.php"

  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones
  App\Service\NotificationService:
    arguments:
      $messagerieUrl: '%env(MESSAGERIE_URL)%'
      $internalSecret: '%env(INTERNAL_SECRET)%'

  App\EventListener\TwoFactorJWTListener:
    tags:
      - { name: kernel.event_listener, event: lexik_jwt_authentication.on_jwt_authenticated, method: onJWTAuthenticated }

  # SEC-13 : injecte userId dans le payload JWT pour que le service messagerie
  # n'ait pas à se fier au userId envoyé par le client (usurpation d'identité).
  App\EventListener\JWTCreatedListener:
    tags:
      - { name: kernel.event_listener, event: lexik_jwt_authentication.on_jwt_created, method: onJWTCreated }

  App\Service\Storage\S3Storage:
    arguments:
      $endpoint: "%env(MINIO_ENDPOINT)%"
      $key: "%env(MINIO_ACCESS_KEY)%"
      $secret: "%env(MINIO_SECRET_KEY)%"
      $bucket: "%env(MINIO_BUCKET)%"
      $publicBaseUrl: "%env(MINIO_PUBLIC_URL)%"

  App\Service\StripeService:
    arguments:
      $stripeSecretKey: '%env(STRIPE_SECRET_KEY)%'
      $stripeWebhookSecret: '%env(STRIPE_WEBHOOK_SECRET)%'

  App\Service\StripeConnectService:
    arguments:
      $stripeSecretKey: '%env(STRIPE_SECRET_KEY)%'
      $stripeReturnUrl: '%env(STRIPE_CONNECT_RETURN_URL)%'
      $stripeRefreshUrl: '%env(STRIPE_CONNECT_REFRESH_URL)%'
      $platformFeeRate: '%env(float:STRIPE_PLATFORM_FEE_RATE)%'
      $stripeFeeRate: '%env(float:STRIPE_FEE_RATE)%'
      $stripeFeeFixedCents: '%env(int:STRIPE_FEE_FIXED_CENTS)%'

  App\Service\Elasticsearch\ElasticClient:
    arguments:
      $host: '%env(ELASTICSEARCH_HOST)%'
      $username: '%env(default::ELASTICSEARCH_USERNAME)%'
      $password: '%env(default::ELASTICSEARCH_PASSWORD)%'

  App\Service\Moderation\BlocklistService:
    arguments:
      $blocklistPath: '%kernel.project_dir%/config/moderation/blocklist.yaml'

when@dev:
  parameters:
    app.doc_role: PUBLIC_ACCESS
