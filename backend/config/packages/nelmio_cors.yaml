nelmio_cors:
    defaults:
        # 1. Autoriser l'interprétation des regex dans allow_origin
        origin_regex: true
        # 2. Utiliser la variable d'environnement définie dans Kubernetes
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS']
        allow_headers: ['Content-Type', 'Authorization']
        allow_credentials: true
        max_age: 3600

    paths:
        # 3. Appliquer la règle à toutes les routes API
        '^/api/': ~