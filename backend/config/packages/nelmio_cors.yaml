nelmio_cors:
    defaults:
        allow_origin: ['http://localhost:3000', 'http://localhost:2999', 'http://localhost:3001']
        allow_methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS']
        allow_headers: ['Content-Type', 'Authorization']
        allow_credentials: true
        max_age: 3600

    paths:
        '^/': null
