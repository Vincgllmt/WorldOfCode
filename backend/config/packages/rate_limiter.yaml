framework:
  rate_limiter:
    login_attempts:
      policy: "sliding_window"
      limit: 5
      interval: "1 minute"
      cache_pool: "cache.rate_limiter"
    register_attempts:
      policy: "sliding_window"
      limit: 3
      interval: "1 hour"
      cache_pool: "cache.rate_limiter"
    password_reset_attempts:
      policy: "sliding_window"
      limit: 3
      interval: "1 hour"
      cache_pool: "cache.rate_limiter"
