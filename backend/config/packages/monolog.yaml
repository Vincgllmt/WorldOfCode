monolog:
    channels:
        - user_error
        - server_error

    handlers:
        main:
            type:      stream
            path:      php://stderr
            level:     debug
            channels:  ['!user_error', '!server_error']
            formatter: monolog.formatter.json

        user_error_handler:
            type:      stream
            path:      php://stderr
            level:     warning
            channels:  [user_error]
            formatter: monolog.formatter.json

        server_error_handler:
            type:      stream
            path:      php://stderr
            level:     error
            channels:  [server_error]
            formatter: monolog.formatter.json
