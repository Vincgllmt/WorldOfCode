security:

  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
      algorithm: bcrypt

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: username

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    api:
      pattern: ^/
      stateless: true
      provider: app_user_provider
      jwt: ~

  access_control:
    - { path: ^/api/register, roles: PUBLIC_ACCESS }
    - { path: ^/api/authenticate, roles: PUBLIC_ACCESS }
    - { path: ^/api/2fa/verify, roles: PUBLIC_ACCESS }
    # SEC-2 (fixé) : l'upload requiert maintenant une authentification.
    - { path: ^/api/upload, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/api/me, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/api/user, roles: IS_AUTHENTICATED_FULLY }
    # SEC-22 (fixé) : la doc OpenAPI n'est plus publique (reconnaissance d'API).
    - { path: ^/doc, roles: ROLE_ADMIN }
    - { path: ^/api/reset-password, roles: PUBLIC_ACCESS }
    - { path: ^/api/payment/webhook, roles: PUBLIC_ACCESS }
    - { path: ^/api/cv/, roles: PUBLIC_ACCESS }
    - { path: ^/doc.json, roles: ROLE_ADMIN }
    - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
  security:
    password_hashers:
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4
        time_cost: 3
        memory_cost: 10
