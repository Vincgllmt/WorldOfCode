# ===================================
# JOB 1: LINTER (Frontend & Backoffice)
# ===================================
lint:frontend-backoffice:
  stage: lint
  image: node:20-alpine # Écrase l'image K8s globale
  cache:
    key:
      files:
        - frontend/package-lock.json
        - backoffice/package-lock.json
    paths:
      - .npm
  before_script: # Écrase le before_script K8s global
    - npm config set cache .npm --global
  script:
    # Lint Frontend
    - echo "🔍 Linting Frontend..."
    - cd frontend
    - npm ci
    - |
      set +e
      npm run lint 2>&1 | tee lint-output.txt
      LINT_EXIT_CODE=$?
      set -e

      # ESLint exit code 1 = erreurs trouvées, 2 = problèmes de config
      if [ $LINT_EXIT_CODE -eq 2 ]; then
        echo "❌ Erreur de configuration du linter Frontend"
        exit 1
      elif [ $LINT_EXIT_CODE -eq 1 ]; then
        # Vérifier si ce sont des erreurs ou juste des warnings
        if grep -E "^.*error\s+" lint-output.txt > /dev/null; then
          echo "❌ Linter Frontend a détecté des ERREURS"
          cat lint-output.txt
          exit 1
        else
          echo "⚠️  Linter Frontend a des warnings (acceptés)"
        fi
      else
        echo "✅ Linter Frontend OK"
      fi
    - cd ..
    # Lint Backoffice
    - echo "🔍 Linting Backoffice..."
    - cd backoffice
    - npm ci
    - |
      set +e
      npm run lint 2>&1 | tee lint-output.txt
      LINT_EXIT_CODE=$?
      set -e

      # ESLint exit code 1 = erreurs trouvées, 2 = problèmes de config
      if [ $LINT_EXIT_CODE -eq 2 ]; then
        echo "❌ Erreur de configuration du linter Backoffice"
        exit 1
      elif [ $LINT_EXIT_CODE -eq 1 ]; then
        # Vérifier si ce sont des erreurs ou juste des warnings
        if grep -E "^.*error\s+" lint-output.txt > /dev/null; then
          echo "❌ Linter Backoffice a détecté des ERREURS"
          cat lint-output.txt
          exit 1
        else
          echo "⚠️  Linter Backoffice a des warnings (acceptés)"
        fi
      else
        echo "✅ Linter Backoffice OK"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
        - backoffice/**/*
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
      changes:
        - frontend/**/*
        - backoffice/**/*
  allow_failure: false

# ===================================
# JOB 0: IMAGE CI OUTILLAGE (Backend)
# PHP 8.4 + extensions + pcov + Composer, pré-compilés.
# Rebuild uniquement quand backend/Dockerfile.ci change (sinon : bouton manuel).
# ===================================
build:ci-image:backend:
  stage: ci-image
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  before_script: [] # Écrase le before_script K8s global
  script:
    - echo "Configuration de l'authentification Kaniko..."
    - AUTH=$(printf "%s:%s" "${REGISTRY_USER}" "${REGISTRY_PASSWORD}" | base64 | tr -d '\n')
    - 'echo "{\"auths\":{\"${REGISTRY_HOST}\":{\"auth\":\"${AUTH}\"}}}" > /kaniko/.docker/config.json'
    - 'echo "Build image CI : ${REGISTRY_HOST}/backend-ci:latest"'
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/backend"
      --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile.ci"
      --destination "${REGISTRY_HOST}/backend-ci:latest"
      --destination "${REGISTRY_HOST}/backend-ci:${CI_COMMIT_SHORT_SHA}"
      --insecure --skip-tls-verify --cache=true
  rules:
    # Rebuild automatique (bloquant) quand la recette de l'image change.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/Dockerfile.ci
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
      changes:
        - backend/Dockerfile.ci
    # Sinon : bouton manuel non bloquant (reconstruction à la demande).
    - when: manual
      allow_failure: true

# ===================================
# JOB 2: COVERAGE (Backend Symfony)
# ===================================
coverage:backend:
  stage: test
  # Image pré-construite : plus aucune compilation d'extension dans ce job.
  image: ${REGISTRY_PULL_HOST}/backend-ci:latest
  needs:
    - job: "build:ci-image:backend"
      optional: true
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"
  cache:
    key:
      files:
        - backend/composer.lock
    paths:
      - backend/vendor/
      # Cache de téléchargement Composer : si le lock change, seuls les
      # paquets modifiés sont re-téléchargés (le reste vient du cache).
      - .cache/composer/
  before_script: # Écrase le before_script K8s global
    - cd backend
    - cp .env.example .env
    - composer install --no-interaction --prefer-dist --optimize-autoloader
    # Générer les clés JWT pour les tests (via la commande Lexik JWT pour garantir le bon format)
    - mkdir -p config/jwt
    - php bin/console lexik:jwt:generate-keypair --overwrite --env=test
  script:
    - echo "🗄️ Setting up test database..."
    # Créer la base de données de test
    - php bin/console doctrine:database:drop --force --env=test || true
    - php bin/console doctrine:database:create --env=test
    - php bin/console doctrine:schema:create --env=test

    - echo "🧪 Running PHPUnit with Coverage..."
    # Couverture via pcov (fourni par l'image CI, comme backend/Dockerfile).
    - |
      php vendor/bin/phpunit --coverage-text --colors=never 2>&1 | tee coverage-output.txt
      EXIT_CODE=${PIPESTATUS[0]}

    # Afficher le résumé du coverage
    - cat coverage-output.txt

    # Vérifier s'il y a des ERREURS (tests échoués)
    - |
      if [ $EXIT_CODE -ne 0 ]; then
        if grep -iE "(FAILURES|ERRORS|Exception|Fatal error)" coverage-output.txt; then
          echo "❌ Tests PHPUnit ont échoué avec des ERREURS"
          exit 1
        fi
      fi

    # Vérifier le seuil de coverage (minimum 90%)
    - |
      COVERAGE=$(grep -oP '^\s*Lines:\s*\K[\d.]+' coverage-output.txt | head -1)
      if [ -z "$COVERAGE" ]; then
        echo "⚠️  Impossible d'extraire le pourcentage de coverage"
        exit 1
      fi
      echo "📊 Coverage Lines: ${COVERAGE}%"
      if [ "$(echo "$COVERAGE < 90" | bc -l)" -eq 1 ]; then
        echo "❌ Coverage insuffisant: ${COVERAGE}% < 90% requis"
        exit 1
      fi
      echo "✅ Coverage Backend OK: ${COVERAGE}%"
  coverage: '/^\s*Lines:\s*\d+\.\d+\%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    paths:
      - backend/coverage-output.txt
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
      changes:
        - backend/**/*
  allow_failure: false

# ===================================
# JOB 3: COVERAGE (Code Arena Symfony)
# ===================================
coverage:code-arena:
  stage: test
  image: php:8.4-cli
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"
  cache:
    key:
      files:
        - code-arena/composer.lock
    paths:
      - code-arena/vendor/
      - .cache/composer/
  before_script:
    - apt-get update && apt-get install -y git unzip libzip-dev libsqlite3-dev openssl bc
    - docker-php-ext-install zip pdo pdo_sqlite
    - pecl install xdebug
    - docker-php-ext-enable xdebug
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - cd code-arena
    - composer install --no-interaction --prefer-dist --optimize-autoloader
    # Générer une paire de clés RSA de test pour lexik JWT (validation only en prod)
    - mkdir -p config/jwt
    - openssl genrsa -out config/jwt/private.pem 2048 2>/dev/null
    - openssl rsa -in config/jwt/private.pem -pubout -out config/jwt/public.pem 2>/dev/null
  script:
    - echo "🧪 Running PHPUnit Code Arena with Coverage..."
    - |
      XDEBUG_MODE=coverage php vendor/bin/phpunit --coverage-text --colors=never 2>&1 | tee coverage-output.txt
      EXIT_CODE=${PIPESTATUS[0]}
    - cat coverage-output.txt
    - |
      if [ $EXIT_CODE -ne 0 ]; then
        if grep -iE "(FAILURES|ERRORS|Exception|Fatal error)" coverage-output.txt; then
          echo "❌ Tests PHPUnit Code Arena ont échoué"
          exit 1
        fi
      fi
    - |
      COVERAGE=$(grep -oP '^\s*Lines:\s*\K[\d.]+' coverage-output.txt | head -1)
      if [ -z "$COVERAGE" ]; then
        echo "⚠️  Impossible d'extraire le pourcentage de coverage"
        exit 1
      fi
      echo "📊 Coverage Lines: ${COVERAGE}%"
      if [ "$(echo "$COVERAGE < 80" | bc -l)" -eq 1 ]; then
        echo "❌ Coverage insuffisant: ${COVERAGE}% < 80% requis"
        exit 1
      fi
      echo "✅ Coverage Code Arena OK: ${COVERAGE}%"
  coverage: '/^\s*Lines:\s*\d+\.\d+\%/'
  artifacts:
    paths:
      - code-arena/coverage-output.txt
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - code-arena/**/*
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
      changes:
        - code-arena/**/*
  allow_failure: false

# ===================================
# JOB 4: COVERAGE (Frontend Next.js)
# Seuil vérifié directement par Jest (coverageThreshold dans jest.config.js).
# ===================================
coverage:frontend:
  stage: test
  image: node:20-alpine # Écrase l'image K8s globale
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      # La clé de cache est le hash de package-lock.json : un hit garantit que
      # node_modules correspond exactement à ce lockfile, donc `npm ci` (qui
      # supprime et réinstalle tout à chaque fois, ~2 min ici) peut être sauté.
      - frontend/node_modules
      # Filet de secours : si le cache node_modules est absent (1er run, cache
      # évincé, backend de cache indisponible), le cache npm évite au moins de
      # retélécharger les tarballs.
      - .npm
  before_script: # Écrase le before_script K8s global
    - npm config set cache .npm --global
    - cd frontend
    - |
      if [ -d node_modules ] && [ -n "$(ls -A node_modules 2>/dev/null)" ]; then
        echo "✅ node_modules restauré depuis le cache, npm ci sauté"
      else
        echo "📦 Installation des dépendances..."
        npm ci --no-audit --no-fund --prefer-offline
      fi
  script:
    - echo "🧪 Running Jest with Coverage..."
    - npm run test:ci
  coverage: '/Statements\s*:\s*\d+\.?\d*%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
    paths:
      - frontend/coverage/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
      changes:
        - frontend/**/*
  allow_failure: false
