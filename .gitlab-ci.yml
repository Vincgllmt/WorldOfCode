variables:
  REGISTRY_HOST: "registry-docker-registry.registry.svc.cluster.local:5000"
  # Désactive le TLS (car on est en interne)
  DOCKER_TLS_CERTDIR: ""
  
  # Indique au client Docker de contacter le service dind via le réseau sur le port 2375
  DOCKER_HOST: "tcp://docker:2375"
  
stages:
  - test             # Pour le futur (tests unitaires, linting)
  - build            # Tous les builds Docker en parallèle
  - deploy-infra     # Longhorn en premier
  - deploy-services  # MySQL, MinIO, Registry en parallèle
  - deploy-apps      # Backend, Frontend, Messagerie, Backoffice en parallèle
  - deploy-monitoring
  - deploy-n8n-ollama

image: alpine/k8s:1.31.13

before_script:
  - set -e
  - echo "Configuration de l'accès à Kubernetes..."
  - cat $KUBECONFIG | base64 -d > /tmp/decoded_kubeconfig
  - export KUBECONFIG=/tmp/decoded_kubeconfig

.deploy_helm_template:
  script:
    - kubectl create namespace "$APP_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
    - USER_B64=$(kubectl get secret registry-client-credentials -n registry -o jsonpath='{.data.username}')
    - PASS_B64=$(kubectl get secret registry-client-credentials -n registry -o jsonpath='{.data.password}')
    - REGISTRY_USER=$(echo -n "$USER_B64" | base64 -d)
    - REGISTRY_PASSWORD=$(echo -n "$PASS_B64" | base64 -d)
    - kubectl create secret docker-registry "$IMAGE_PULL_SECRET" --docker-server="$REGISTRY_HOST" --docker-username="$REGISTRY_USER" --docker-password="$REGISTRY_PASSWORD" -n "$APP_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
    - echo "Déploiement Helm sur le namespace $APP_NAMESPACE avec les valeurs $VALUES_FILE"
    - helm upgrade --install "$RELEASE_NAME" "$CHART_PATH" --namespace "$APP_NAMESPACE" --values "$VALUES_FILE" --set image.tag=$CI_COMMIT_SHORT_SHA

include:
  - local: cluster/longhorn/.gitlab-ci.yml
  - local: cluster/jwt/.gitlab-ci.yml
  - local: cluster/mysql/.gitlab-ci.yml
  - local: cluster/registry/.gitlab-ci.yml
  - local: cluster/minio/.gitlab-ci.yml
  - local: cluster/monitoring/.gitlab-ci.yml
  - local: cluster/backend/.gitlab-ci.yml
  - local: cluster/frontend/.gitlab-ci.yml
  - local: cluster/messagerie/.gitlab-ci.yml
  - local: cluster/backoffice/.gitlab-ci.yml
  - local: cluster/n8n/.gitlab-ci.yml
